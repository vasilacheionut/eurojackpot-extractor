name: Update Eurojackpot Draws JSON

on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch:
    inputs:
      years_range:
        description: "Optional years (e.g. 2023-2019, 2017-2012, 2026). Leave empty for all years."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch-draws:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Fetch complete Eurojackpot draws
        env:
          YEARS_RANGE: ${{ inputs.years_range }}
        run: |
          node -e '
          const fs = require("fs");
          const { chromium } = require("playwright");

          function inferYear(dateStr, fallbackYear) {
            const m = String(dateStr || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (m) return Number(m[3]);
            return fallbackYear ? Number(fallbackYear) : null;
          }

          function parseDMYToNum(dateStr) {
            const m = String(dateStr || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (!m) return 0;
            return Number(`${m[3]}${m[2]}${m[1]}`);
          }

          function parseRequestedYears(rangeStr, availableYears) {
            const raw = String(rangeStr || "").trim();
            if (!raw) return availableYears;

            const parts = raw.split(",").map((p) => p.trim()).filter(Boolean);
            const set = new Set();

            for (const part of parts) {
              const rangeMatch = part.match(/^(\d{4})\s*-\s*(\d{4})$/);
              if (rangeMatch) {
                const a = Number(rangeMatch[1]);
                const b = Number(rangeMatch[2]);
                const hi = Math.max(a, b);
                const lo = Math.min(a, b);
                for (let y = hi; y >= lo; y--) {
                  set.add(String(y));
                }
              } else if (/^\d{4}$/.test(part)) {
                set.add(part);
              }
            }

            const filtered = availableYears.filter((y) => set.has(y.label) || set.has(y.value));
            return filtered.length > 0 ? filtered : Array.from(set).sort((a, b) => Number(b) - Number(a)).map((y) => ({ label: y, value: y }));
          }

          async function selectYearOption(page, yearOpt) {
            const sel = page.locator("select[formcontrolname=\"jahr\"]").first();
            const prevFirstDate = await page.locator("select[formcontrolname=\"datum\"] option").first().textContent().catch(() => "");

            let selected = false;
            if (yearOpt.value) {
              selected = await sel.selectOption({ value: yearOpt.value }, { timeout: 6000 }).then(() => true).catch(() => false);
            }
            if (!selected && yearOpt.label) {
              selected = await sel.selectOption({ label: yearOpt.label }, { timeout: 6000 }).then(() => true).catch(() => false);
            }

            await sel.evaluate((el, opt) => {
              const target = Array.from(el.options).find(
                (o) => (opt.value && o.value === opt.value) || (opt.label && (o.textContent || "").trim() === opt.label)
              );
              if (target) {
                el.value = target.value;
                target.selected = true;
              } else if (opt.value) {
                el.value = opt.value;
              }
              el.dispatchEvent(new Event("input", { bubbles: true }));
              el.dispatchEvent(new Event("change", { bubbles: true }));
            }, yearOpt);

            for (let i = 0; i < 15; i++) {
              await page.waitForTimeout(200);
              const curFirstDate = await page.locator("select[formcontrolname=\"datum\"] option").first().textContent().catch(() => "");
              if (curFirstDate && curFirstDate !== prevFirstDate) {
                break;
              }
            }
            await page.waitForTimeout(400);
          }

          async function selectDateOption(page, dateOpt) {
            const sel = page.locator("select[formcontrolname=\"datum\"]").first();
            let ok = false;
            if (dateOpt.value) {
              ok = await sel.selectOption({ value: dateOpt.value }, { timeout: 4000 }).then(() => true).catch(() => false);
            }
            if (!ok && dateOpt.label) {
              ok = await sel.selectOption({ label: dateOpt.label }, { timeout: 4000 }).then(() => true).catch(() => false);
            }
            if (!ok) {
              await sel.evaluate((el, opt) => {
                const target = Array.from(el.options).find(
                  (o) => (opt.value && o.value === opt.value) || (opt.label && (o.textContent || "").trim() === opt.label)
                );
                if (target) {
                  el.value = target.value;
                  target.selected = true;
                } else if (opt.value) {
                  el.value = opt.value;
                }
                el.dispatchEvent(new Event("input", { bubbles: true }));
                el.dispatchEvent(new Event("change", { bubbles: true }));
              }, dateOpt);
            }
            await page.waitForTimeout(180);
          }

          async function readCurrentDraw(page, fallbackYear, fallbackLabel) {
            return page.evaluate(({ fbYear, fbLabel }) => {
              const host = document.querySelector("app-winning-numbers") || document.body;
              const winningEls = Array.from(host.querySelectorAll(".winning-number"));
              const nums = winningEls
                .map((el) => Number((el.textContent || "").trim()))
                .filter((n) => !Number.isNaN(n));

              const datumSelect = document.querySelector("select[formcontrolname=\"datum\"]");
              let dateStr = null;

              if (datumSelect && datumSelect.selectedOptions && datumSelect.selectedOptions[0]) {
                const txt = (datumSelect.selectedOptions[0].textContent || "").trim();
                const m = txt.match(/\b(\d{2}\.\d{2}\.\d{4})\b/);
                if (m) dateStr = m[1];
              }

              if (!dateStr && fbLabel) {
                const m = String(fbLabel).match(/\b(\d{2}\.\d{2}\.\d{4})\b/);
                if (m) dateStr = m[1];
              }

              if (!dateStr && datumSelect && datumSelect.value) {
                const isoMatch = String(datumSelect.value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
                if (isoMatch) {
                  dateStr = `${isoMatch[3]}.${isoMatch[2]}.${isoMatch[1]}`;
                }
              }

              const yearMatch = dateStr ? dateStr.match(/\.(\d{4})$/) : null;
              const year = yearMatch ? Number(yearMatch[1]) : (fbYear ? Number(fbYear) : null);

              return {
                year,
                date: dateStr,
                mainNumbers: nums.slice(0, 5),
                euroNumbers: nums.slice(5, 7)
              };
            }, { fbYear: fallbackYear, fbLabel: fallbackLabel });
          }

          async function run() {
            const url = "https://www.eurojackpot.com/";
            const collectedMap = new Map();

            function addDraw(d) {
              if (!d || !Array.isArray(d.mainNumbers) || d.mainNumbers.length !== 5) return false;
              if (!Array.isArray(d.euroNumbers) || d.euroNumbers.length !== 2) return false;
              if (!d.date) return false;
              const year = inferYear(d.date, d.year);
              if (!year) return false;
              collectedMap.set(d.date, {
                year,
                date: d.date,
                mainNumbers: d.mainNumbers,
                euroNumbers: d.euroNumbers
              });
              return true;
            }

            function saveCleanJson() {
              const draws = Array.from(collectedMap.values()).sort(
                (a, b) => parseDMYToNum(b.date) - parseDMYToNum(a.date)
              );
              fs.writeFileSync("draws.json", JSON.stringify({ draws }, null, 2), "utf8");
              return draws.length;
            }

            try {
              if (fs.existsSync("draws.json")) {
                const prev = JSON.parse(fs.readFileSync("draws.json", "utf8"));
                if (Array.isArray(prev.draws)) {
                  for (const item of prev.draws) {
                    addDraw(item);
                  }
                }
              }
            } catch (e) {
              console.error("Warning reading existing draws.json:", e.message);
            }

            console.log("Initial draws loaded:", collectedMap.size);

            let browser;
            try {
              browser = await chromium.launch({
                headless: true,
                args: ["--disable-blink-features=AutomationControlled"]
              });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                locale: "en-US",
                viewport: { width: 1280, height: 800 }
              });
              const page = await context.newPage();

              await page.goto(url, { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.waitForSelector("select[formcontrolname=\"jahr\"]", { timeout: 30000 });
              await page.waitForTimeout(1500);

              const cookieButtons = [
                "button:has-text(\"Accept\")",
                "button:has-text(\"Agree\")",
                "button:has-text(\"Akzeptieren\")",
                "button:has-text(\"Alle akzeptieren\")"
              ];
              for (const sel of cookieButtons) {
                const btn = page.locator(sel).first();
                if (await btn.isVisible({ timeout: 1000 }).catch(() => false)) {
                  await btn.click({ force: true }).catch(() => {});
                  await page.waitForTimeout(1000);
                  break;
                }
              }

              const yearOptions = await page.locator("select[formcontrolname=\"jahr\"] option").evaluateAll((opts) =>
                opts
                  .map((o) => ({
                    value: (o.value || "").trim(),
                    label: (o.textContent || "").trim()
                  }))
                  .filter((o) => /^\d{4}$/.test(o.label) || /^\d{4}$/.test(o.value))
              );

              console.log("Available year options on site:", yearOptions.map((o) => `${o.label}(${o.value})`).join(", "));

              const fallbackList = Array.from({ length: 15 }, (_, i) => ({
                label: String(2026 - i),
                value: String(2026 - i)
              }));
              const baseYears = yearOptions.length > 0 ? yearOptions : fallbackList;
              const yearsToProcess = parseRequestedYears(process.env.YEARS_RANGE, baseYears);
              console.log("Years to process:", yearsToProcess.map((y) => y.label || y.value).join(", "));

              for (const yrOpt of yearsToProcess) {
                const yrLabel = yrOpt.label || yrOpt.value;
                try {
                  await selectYearOption(page, yrOpt);

                  const dateOptions = await page.locator("select[formcontrolname=\"datum\"] option").evaluateAll((opts) =>
                    opts
                      .map((o) => ({
                        value: (o.value || "").trim(),
                        label: (o.textContent || "").trim()
                      }))
                      .filter((o) => o.value.length > 0 || o.label.length > 0)
                  );

                  let addedThisYear = 0;
                  for (const dOpt of dateOptions) {
                    try {
                      await selectDateOption(page, dOpt);
                      const draw = await readCurrentDraw(page, Number(yrLabel), dOpt.label);
                      if (addDraw(draw)) {
                        addedThisYear++;
                      }
                    } catch (dateErr) {
                      console.error(`Error on year ${yrLabel}, date ${dOpt.label || dOpt.value}:`, dateErr.message);
                    }
                  }

                  const totalNow = saveCleanJson();
                  console.log(`Year ${yrLabel}: ${dateOptions.length} dates found, ${addedThisYear} parsed, total saved: ${totalNow}`);
                } catch (yrErr) {
                  console.error(`Error processing year ${yrLabel}:`, yrErr.message);
                }
              }
            } catch (err) {
              console.error("Fatal error:", err.message);
              process.exitCode = 1;
            } finally {
              if (browser) {
                await browser.close();
              }
            }

            const finalTotal = saveCleanJson();
            console.log("Final total draws in draws.json:", finalTotal);
          }

          run();
          '

      - name: Validate draws.json integrity
        run: |
          node -e '
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("draws.json", "utf8"));
          if (!data || !Array.isArray(data.draws) || data.draws.length === 0) {
            throw new Error("draws.json has no draws array or is empty");
          }

          const seenDates = new Set();
          const byYear = {};

          for (const d of data.draws) {
            if (!/^\d{2}\.\d{2}\.\d{4}$/.test(String(d.date || ""))) {
              throw new Error(`Invalid date format: ${d.date}`);
            }
            if (seenDates.has(d.date)) {
              throw new Error(`Duplicate draw date: ${d.date}`);
            }
            seenDates.add(d.date);

            const dateYear = Number(d.date.slice(-4));
            if (Number(d.year) !== dateYear) {
              throw new Error(`Year mismatch on ${d.date}: year=${d.year}`);
            }

            if (!Array.isArray(d.mainNumbers) || d.mainNumbers.length !== 5) {
              throw new Error(`Invalid mainNumbers length on ${d.date}`);
            }
            const mainSet = new Set(d.mainNumbers);
            if (mainSet.size !== 5 || d.mainNumbers.some((n) => !Number.isInteger(n) || n < 1 || n > 50)) {
              throw new Error(`Invalid mainNumbers values on ${d.date}: ${JSON.stringify(d.mainNumbers)}`);
            }

            if (!Array.isArray(d.euroNumbers) || d.euroNumbers.length !== 2) {
              throw new Error(`Invalid euroNumbers length on ${d.date}`);
            }
            const euroSet = new Set(d.euroNumbers);
            if (euroSet.size !== 2 || d.euroNumbers.some((n) => !Number.isInteger(n) || n < 1 || n > 12)) {
              throw new Error(`Invalid euroNumbers values on ${d.date}: ${JSON.stringify(d.euroNumbers)}`);
            }

            byYear[d.year] = (byYear[d.year] || 0) + 1;
          }

          console.log("Validation passed. Total draws:", data.draws.length);
          console.log("Draws per year:", byYear);
          '

      - name: Clean temporary node files
        run: rm -rf node_modules package.json package-lock.json

      - name: Commit and push draws.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          if git diff --staged --quiet; then
            echo "No changes in draws.json"
          else
            git commit -m "Update Eurojackpot draws.json"
            git push
          fi
