name: Update Eurojackpot Draws JSON

on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Capture network API responses and page state
        run: |
          node -e '
          const fs = require("fs");
          const { chromium } = require("playwright");

          async function run() {
            const url = "https://www.eurojackpot.com/";
            const output = {
              source: url,
              updatedAt: new Date().toISOString(),
              fetchedOk: false,
              pageTitle: null,
              error: null,
              networkJsonUrls: [],
              networkSnippets: [],
              bodyTextPreview: null,
              draws: []
            };

            let browser;
            try {
              browser = await chromium.launch({
                headless: true,
                args: ["--disable-blink-features=AutomationControlled"]
              });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                locale: "de-DE",
                viewport: { width: 1280, height: 800 }
              });
              const page = await context.newPage();

              page.on("response", async (response) => {
                try {
                  const resUrl = response.url();
                  const ct = response.headers()["content-type"] || "";
                  if (ct.includes("json") || /api|draw|ziehung|zahlen|quoten|eurojackpot/i.test(resUrl)) {
                    if (!/\.(js|css|svg|png|jpg|woff2?|ttf)(\?|$)/i.test(resUrl)) {
                      output.networkJsonUrls.push({
                        status: response.status(),
                        url: resUrl
                      });
                      if (ct.includes("json") && response.status() === 200) {
                        const txt = await response.text();
                        output.networkSnippets.push({
                          url: resUrl,
                          preview: txt.slice(0, 400)
                        });
                      }
                    }
                  }
                } catch (_) {}
              });

              await page.goto(url, { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.waitForTimeout(8000);

              output.pageTitle = await page.title();
              const pageInfo = await page.evaluate(() => {
                const bodyText = document.body ? document.body.innerText.replace(/\s+/g, " ").trim() : "";
                const numbers = Array.from(document.querySelectorAll(".winning-number"))
                  .map((el) => Number(el.textContent.trim()))
                  .filter((n) => Number.isInteger(n) && n > 0);
                return {
                  bodyText: bodyText.slice(0, 600),
                  numbers
                };
              });

              output.bodyTextPreview = pageInfo.bodyText;
              output.fetchedOk = true;

              if (pageInfo.numbers.length >= 7) {
                output.draws.push({
                  mainNumbers: pageInfo.numbers.slice(0, 5),
                  euroNumbers: pageInfo.numbers.slice(5, 7)
                });
              }
            } catch (err) {
              output.error = err.message;
            } finally {
              if (browser) {
                await browser.close();
              }
            }

            fs.writeFileSync("draws.json", JSON.stringify(output, null, 2), "utf8");
          }

          run();
          '

      - name: Clean temporary node files
        run: rm -rf node_modules package.json package-lock.json

      - name: Commit and push draws.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          if git diff --staged --quiet; then
            echo "No changes in draws.json"
          else
            git commit -m "Update Eurojackpot draws.json"
            git push
          fi
