name: Update Eurojackpot Draws JSON

on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch:
    inputs:
      years_range:
        description: "Optional years (e.g. 2023-2019, 2017-2012, 2026). Leave empty for all years 2026-2012."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch-draws:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Fetch complete Eurojackpot draws
        env:
          YEARS_RANGE: ${{ inputs.years_range }}
        run: |
          node -e '
          const fs = require("fs");
          const { chromium } = require("playwright");

          function inferYear(dateStr, fallbackYear) {
            const m = String(dateStr || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (m) return Number(m[3]);
            return fallbackYear ? Number(fallbackYear) : null;
          }

          function parseDMYToNum(dateStr) {
            const m = String(dateStr || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (!m) return 0;
            return Number(`${m[3]}${m[2]}${m[1]}`);
          }

          function parseRequestedYears(rangeStr, availableYears) {
            const raw = String(rangeStr || "").trim();
            if (!raw) return availableYears;

            const parts = raw.split(",").map((p) => p.trim()).filter(Boolean);
            const set = new Set();

            for (const part of parts) {
              const rangeMatch = part.match(/^(\d{4})\s*-\s*(\d{4})$/);
              if (rangeMatch) {
                const a = Number(rangeMatch[1]);
                const b = Number(rangeMatch[2]);
                const hi = Math.max(a, b);
                const lo = Math.min(a, b);
                for (let y = hi; y >= lo; y--) {
                  set.add(String(y));
                }
              } else if (/^\d{4}$/.test(part)) {
                set.add(part);
              }
            }

            const filtered = availableYears.filter((y) => set.has(y));
            return filtered.length > 0 ? filtered : Array.from(set).sort((a, b) => Number(b) - Number(a));
          }

          async function setSelectValue(page, selector, value) {
            const loc = page.locator(selector).first();
            try {
              await loc.selectOption(value, { force: true, timeout: 8000 });
            } catch (_) {}

            await loc.evaluate((el, val) => {
              el.value = val;
              el.dispatchEvent(new Event("input", { bubbles: true }));
              el.dispatchEvent(new Event("change", { bubbles: true }));
            }, value);
          }

          async function readCurrentDraw(page, fallbackYear) {
            return page.evaluate((fbYear) => {
              const host = document.querySelector("app-winning-numbers") || document.body;
              const winningEls = Array.from(host.querySelectorAll(".winning-number"));
              const nums = winningEls
                .map((el) => Number((el.textContent || "").trim()))
                .filter((n) => !Number.isNaN(n));

              const datumSelect = document.querySelector("select[formcontrolname=\"datum\"]");
              let dateStr = null;

              if (datumSelect && datumSelect.selectedOptions && datumSelect.selectedOptions[0]) {
                const txt = (datumSelect.selectedOptions[0].textContent || "").trim();
                const m = txt.match(/\b(\d{2}\.\d{2}\.\d{4})\b/);
                if (m) dateStr = m[1];
              }

              if (!dateStr) {
                const allText = (host.innerText || "").replace(/\s+/g, " ");
                const matches = allText.match(/\b\d{2}\.\d{2}\.\d{4}\b/g) || [];
                if (matches.length > 0) dateStr = matches[0];
              }

              if (!dateStr && datumSelect && datumSelect.value) {
                const isoMatch = String(datumSelect.value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
                if (isoMatch) {
                  dateStr = `${isoMatch[3]}.${isoMatch[2]}.${isoMatch[1]}`;
                }
              }

              const yearMatch = dateStr ? dateStr.match(/\.(\d{4})$/) : null;
              const year = yearMatch ? Number(yearMatch[1]) : (fbYear ? Number(fbYear) : null);

              return {
                year,
                date: dateStr,
                mainNumbers: nums.slice(0, 5),
                euroNumbers: nums.slice(5, 7)
              };
            }, fallbackYear);
          }

          async function run() {
            const url = "https://www.eurojackpot.com/";
            const collectedMap = new Map();

            function addDraw(d) {
              if (!d || !Array.isArray(d.mainNumbers) || d.mainNumbers.length !== 5) return false;
              if (!Array.isArray(d.euroNumbers) || d.euroNumbers.length !== 2) return false;
              if (!d.date) return false;
              const year = inferYear(d.date, d.year);
              if (!year) return false;
              collectedMap.set(d.date, {
                year,
                date: d.date,
                mainNumbers: d.mainNumbers,
                euroNumbers: d.euroNumbers
              });
              return true;
            }

            function saveCleanJson() {
              const draws = Array.from(collectedMap.values()).sort(
                (a, b) => parseDMYToNum(b.date) - parseDMYToNum(a.date)
              );
              fs.writeFileSync("draws.json", JSON.stringify({ draws }, null, 2), "utf8");
              return draws.length;
            }

            try {
              if (fs.existsSync("draws.json")) {
                const prev = JSON.parse(fs.readFileSync("draws.json", "utf8"));
                if (Array.isArray(prev.draws)) {
                  for (const item of prev.draws) {
                    addDraw(item);
                  }
                }
              }
            } catch (e) {
              console.error("Warning reading existing draws.json:", e.message);
            }

            console.log("Initial draws loaded:", collectedMap.size);

            let browser;
            try {
              browser = await chromium.launch({
                headless: true,
                args: ["--disable-blink-features=AutomationControlled"]
              });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                locale: "en-US",
                viewport: { width: 1280, height: 800 }
              });
              const page = await context.newPage();

              await page.goto(url, { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.waitForSelector("select[formcontrolname=\"jahr\"]", { timeout: 30000 });
              await page.waitForTimeout(1500);

              const cookieButtons = [
                "button:has-text(\"Accept\")",
                "button:has-text(\"Agree\")",
                "button:has-text(\"Akzeptieren\")",
                "button:has-text(\"Alle akzeptieren\")"
              ];
              for (const sel of cookieButtons) {
                const btn = page.locator(sel).first();
                if (await btn.isVisible({ timeout: 1000 }).catch(() => false)) {
                  await btn.click({ force: true }).catch(() => {});
                  await page.waitForTimeout(1000);
                  break;
                }
              }

              const yearOptions = await page.locator("select[formcontrolname=\"jahr\"] option").evaluateAll((opts) =>
                opts
                  .map((o) => ({ value: (o.value || "").trim(), text: (o.textContent || "").trim() }))
                  .filter((o) => /^\d{4}$/.test(o.value || o.text))
                  .map((o) => o.value || o.text)
              );

              const baseYears = yearOptions.length > 0 ? yearOptions : Array.from({ length: 15 }, (_, i) => String(2026 - i));
              const yearsToProcess = parseRequestedYears(process.env.YEARS_RANGE, baseYears);
              console.log("Years to process:", yearsToProcess.join(", "));

              for (const yr of yearsToProcess) {
                try {
                  await setSelectValue(page, "select[formcontrolname=\"jahr\"]", yr);
                  await page.waitForTimeout(700);

                  const dateValues = await page.locator("select[formcontrolname=\"datum\"] option").evaluateAll((opts) =>
                    opts
                      .map((o) => (o.value || "").trim())
                      .filter((v) => v.length > 0)
                  );

                  let addedThisYear = 0;
                  for (const dVal of dateValues) {
                    try {
                      await setSelectValue(page, "select[formcontrolname=\"datum\"]", dVal);
                      await page.waitForTimeout(180);
                      const draw = await readCurrentDraw(page, Number(yr));
                      if (addDraw(draw)) {
                        addedThisYear++;
                      }
                    } catch (dateErr) {
                      console.error(`Error on year ${yr}, date ${dVal}:`, dateErr.message);
                    }
                  }

                  const totalNow = saveCleanJson();
                  console.log(`Year ${yr}: ${dateValues.length} dates checked, total saved: ${totalNow}`);
                } catch (yrErr) {
                  console.error(`Error processing year ${yr}:`, yrErr.message);
                }
              }
            } catch (err) {
              console.error("Fatal error:", err.message);
              process.exitCode = 1;
            } finally {
              if (browser) {
                await browser.close();
              }
            }

            const finalTotal = saveCleanJson();
            console.log("Final total draws in draws.json:", finalTotal);
          }

          run();
          '

      - name: Clean temporary node files
        run: rm -rf node_modules package.json package-lock.json

      - name: Commit and push draws.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          if git diff --staged --quiet; then
            echo "No changes in draws.json"
          else
            git commit -m "Update Eurojackpot draws.json"
            git push
          fi
