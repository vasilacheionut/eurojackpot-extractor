name: Update Eurojackpot Draws JSON

on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Fetch Eurojackpot draws and inspect historical navigation controls
        run: |
          node -e '
          const fs = require("fs");
          const { chromium } = require("playwright");

          function inferYear(dateStr, fallbackYear) {
            const m = String(dateStr || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (m) return Number(m[3]);
            return fallbackYear ? Number(fallbackYear) : null;
          }

          function parseDMYToNum(dateStr) {
            const m = String(dateStr || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (!m) return 0;
            return Number(`${m[3]}${m[2]}${m[1]}`);
          }

          function buildYearsAndDates(drawsList) {
            const yearSet = new Set();
            const mapByYear = new Map();

            for (const d of drawsList) {
              const y = inferYear(d.date || d.dateLabel, d.year);
              if (!y) continue;
              yearSet.add(y);
              const yKey = String(y);
              if (!mapByYear.has(yKey)) {
                mapByYear.set(yKey, new Map());
              }
              const dateKey = d.date || d.dateLabel;
              if (dateKey && !mapByYear.get(yKey).has(dateKey)) {
                mapByYear.get(yKey).set(dateKey, {
                  date: d.date || null,
                  dateLabel: d.dateLabel || d.date
                });
              }
            }

            const availableYears = Array.from(yearSet).sort((a, b) => b - a);
            const datesByYear = {};

            for (const y of availableYears) {
              const yKey = String(y);
              const entries = Array.from(mapByYear.get(yKey).values()).sort(
                (a, b) => parseDMYToNum(b.date || b.dateLabel) - parseDMYToNum(a.date || a.dateLabel)
              );
              datesByYear[yKey] = entries;
            }

            return { availableYears, datesByYear };
          }

          async function run() {
            const url = "https://www.eurojackpot.com/";

            let prevJson = {};
            let existingDraws = [];
            try {
              if (fs.existsSync("draws.json")) {
                prevJson = JSON.parse(fs.readFileSync("draws.json", "utf8"));
                if (Array.isArray(prevJson.draws)) {
                  existingDraws = prevJson.draws;
                }
              }
            } catch (_) {}

            const output = {
              source: url,
              updatedAt: new Date().toISOString(),
              fetchedOk: false,
              error: null,
              nextDrawDate: prevJson.nextDrawDate || null,
              latestDrawDate: prevJson.latestDrawDate || null,
              availableYears: [],
              datesByYear: {},
              debugControlsInfo: null,
              totalDraws: 0,
              draws: []
            };

            let browser;

            try {
              browser = await chromium.launch({
                headless: true,
                args: ["--disable-blink-features=AutomationControlled"]
              });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                locale: "en-US",
                viewport: { width: 1280, height: 800 }
              });
              const page = await context.newPage();

              await page.goto(url, { waitUntil: "networkidle", timeout: 45000 }).catch(() => {});
              await page.waitForTimeout(3000);

              const cookieButtons = [
                "button:has-text(\"Accept\")",
                "button:has-text(\"Agree\")",
                "button:has-text(\"Akzeptieren\")",
                "button:has-text(\"Alle akzeptieren\")"
              ];
              for (const sel of cookieButtons) {
                const btn = page.locator(sel).first();
                if (await btn.isVisible({ timeout: 1000 }).catch(() => false)) {
                  await btn.click().catch(() => {});
                  await page.waitForTimeout(1500);
                  break;
                }
              }

              await page.waitForTimeout(1500);

              const controlsInfo = await page.evaluate(() => {
                const host = document.querySelector("app-winning-numbers") || document;
                const selects = Array.from(document.querySelectorAll("select")).map((s, i) => ({
                  idx: i,
                  id: s.id || null,
                  formControlName: s.getAttribute("formcontrolname") || null,
                  optionsCount: s.options ? s.options.length : 0,
                  options: s.options ? Array.from(s.options).slice(0, 15).map((o) => ({ value: o.value, text: (o.textContent || "").trim() })) : []
                }));

                const buttons = Array.from(host.querySelectorAll("button, [role=\"button\"], a")).map((el, i) => ({
                  idx: i,
                  tag: el.tagName.toLowerCase(),
                  text: (el.textContent || "").replace(/\s+/g, " ").trim().slice(0, 60),
                  ariaLabel: el.getAttribute("aria-label") || null,
                  className: (el.className || "").toString().slice(0, 80)
                })).filter((b) => b.text || b.ariaLabel);

                const inputs = Array.from(host.querySelectorAll("input, [formcontrolname]")).map((el, i) => ({
                  idx: i,
                  tag: el.tagName.toLowerCase(),
                  type: el.getAttribute("type") || null,
                  formControlName: el.getAttribute("formcontrolname") || null,
                  value: el.value || null,
                  className: (el.className || "").toString().slice(0, 80)
                }));

                return {
                  selects,
                  buttons: buttons.slice(0, 30),
                  inputs: inputs.slice(0, 20)
                };
              });

              output.debugControlsInfo = controlsInfo;

              const pageInfo = await page.evaluate(() => {
                const host = document.querySelector("app-winning-numbers") || document.body;
                const nextDateEl = host.querySelector(".next-win-date");
                const nextDrawDate = nextDateEl ? nextDateEl.textContent.replace(/\s+/g, " ").trim() : "";

                const winningEls = Array.from(host.querySelectorAll(".winning-number"));
                const nums = winningEls
                  .map((el) => Number((el.textContent || "").trim()))
                  .filter((n) => !Number.isNaN(n));

                const allText = (host.innerText || "").replace(/\s+/g, " ");
                const dateMatches = allText.match(/\b\d{2}\.\d{2}\.20\d{2}\b/g) || [];

                return {
                  nextDrawDate,
                  mainNumbers: nums.slice(0, 5),
                  euroNumbers: nums.slice(5, 7),
                  datesFoundInText: Array.from(new Set(dateMatches))
                };
              });

              output.fetchedOk = true;
              if (pageInfo.nextDrawDate) output.nextDrawDate = pageInfo.nextDrawDate;
              if (pageInfo.datesFoundInText && pageInfo.datesFoundInText[0]) {
                output.latestDrawDate = pageInfo.datesFoundInText[0];
              }

              const collectedMap = new Map();
              function addDraw(d) {
                if (!d || !Array.isArray(d.mainNumbers) || d.mainNumbers.length !== 5) return false;
                if (!Array.isArray(d.euroNumbers) || d.euroNumbers.length !== 2) return false;
                const key = d.date || d.dateLabel;
                if (!key) return false;
                const normalizedYear = inferYear(d.date || d.dateLabel, d.year);
                if (collectedMap.has(key)) {
                  const existing = collectedMap.get(key);
                  if (existing.year !== normalizedYear && normalizedYear) {
                    collectedMap.set(key, { ...existing, year: normalizedYear });
                  }
                  return false;
                }
                collectedMap.set(key, {
                  year: normalizedYear,
                  date: d.date,
                  dateLabel: d.dateLabel || d.date,
                  mainNumbers: d.mainNumbers,
                  euroNumbers: d.euroNumbers
                });
                return true;
              }

              for (const oldDraw of existingDraws) {
                addDraw(oldDraw);
              }

              if (pageInfo.mainNumbers.length === 5 && pageInfo.euroNumbers.length === 2 && pageInfo.datesFoundInText[0]) {
                const dStr = pageInfo.datesFoundInText[0];
                addDraw({
                  year: inferYear(dStr, 2026),
                  date: dStr,
                  dateLabel: dStr,
                  mainNumbers: pageInfo.mainNumbers,
                  euroNumbers: pageInfo.euroNumbers
                });
              }

              const allDraws = Array.from(collectedMap.values()).sort(
                (a, b) => parseDMYToNum(b.date) - parseDMYToNum(a.date)
              );

              const built = buildYearsAndDates(allDraws);
              output.availableYears = built.availableYears;
              output.datesByYear = built.datesByYear;
              output.draws = allDraws;
              output.totalDraws = allDraws.length;
              if (!output.latestDrawDate && allDraws.length > 0) {
                output.latestDrawDate = allDraws[0].dateLabel || allDraws[0].date;
              }
            } catch (err) {
              output.error = err.message;
            } finally {
              if (browser) {
                await browser.close();
              }
            }

            fs.writeFileSync("draws.json", JSON.stringify(output, null, 2), "utf8");
          }

          run();
          '

      - name: Clean temporary node files
        run: rm -rf node_modules package.json package-lock.json

      - name: Commit and push draws.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          if git diff --staged --quiet; then
            echo "No changes in draws.json"
          else
            git commit -m "Update Eurojackpot draws.json"
            git push
          fi
