name: Update Eurojackpot Draws JSON

on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Render page and extract Eurojackpot draw
        run: |
          node -e '
          const fs = require("fs");
          const { chromium } = require("playwright");

          async function run() {
            const url = "https://www.eurojackpot.com/";
            const output = {
              source: url,
              updatedAt: new Date().toISOString(),
              fetchedOk: false,
              error: null,
              detectedDate: null,
              detectedYear: null,
              availableYears: [],
              availableDates: [],
              draws: []
            };

            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                locale: "de-DE"
              });
              const page = await context.newPage();

              await page.goto(url, { waitUntil: "networkidle", timeout: 60000 });

              // Asteptam ca aplicatia Angular sa populeze numerele castigatoare
              await page.waitForSelector(".winning-number", { timeout: 30000 });
              await page.waitForTimeout(1500);

              const extracted = await page.evaluate(() => {
                const yearSelect = document.querySelector("select[formcontrolname=\"jahr\"]");
                const dateSelect = document.querySelector("select[formcontrolname=\"datum\"]");

                const years = yearSelect
                  ? Array.from(yearSelect.options).map((o) => o.text.trim()).filter(Boolean)
                  : [];
                const selectedYear = yearSelect && yearSelect.selectedOptions[0]
                  ? yearSelect.selectedOptions[0].text.trim()
                  : null;

                const dates = dateSelect
                  ? Array.from(dateSelect.options).map((o) => o.text.trim()).filter(Boolean)
                  : [];
                const selectedDate = dateSelect && dateSelect.selectedOptions[0]
                  ? dateSelect.selectedOptions[0].text.trim()
                  : null;

                const numberNodes = Array.from(document.querySelectorAll(".winning-number"));
                const numbers = numberNodes
                  .map((el) => Number(el.textContent.trim()))
                  .filter((n) => Number.isInteger(n) && n > 0);

                return {
                  years,
                  selectedYear,
                  dates,
                  selectedDate,
                  numbers
                };
              });

              output.fetchedOk = true;
              output.availableYears = extracted.years;
              output.availableDates = extracted.dates.slice(0, 15);
              output.detectedYear = extracted.selectedYear ? Number(extracted.selectedYear) : null;
              output.detectedDate = extracted.selectedDate || null;

              if (extracted.numbers.length >= 7) {
                output.draws.push({
                  year: output.detectedYear,
                  date: output.detectedDate,
                  mainNumbers: extracted.numbers.slice(0, 5),
                  euroNumbers: extracted.numbers.slice(5, 7)
                });
              }
            } catch (err) {
              output.error = err.message;
            } finally {
              if (browser) {
                await browser.close();
              }
            }

            fs.writeFileSync("draws.json", JSON.stringify(output, null, 2), "utf8");
          }

          run();
          '

      - name: Clean temporary node files
        run: rm -rf node_modules package.json package-lock.json

      - name: Commit and push draws.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          if git diff --staged --quiet; then
            echo "No changes in draws.json"
          else
            git commit -m "Update Eurojackpot draws.json"
            git push
          fi
