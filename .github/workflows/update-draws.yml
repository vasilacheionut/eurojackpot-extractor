name: Update Eurojackpot Draws JSON

on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Catalog years (2012-2026) and dates per year, then extract draws
        run: |
          node -e '
          const fs = require("fs");
          const { chromium } = require("playwright");

          const MAX_NEW_DRAWS_PER_RUN = 500;

          function extractShortDate(label) {
            if (!label) return null;
            const m = String(label).match(/\b(\d{2}\.\d{2}\.\d{4})\b/);
            return m ? m[1] : String(label).trim();
          }

          function inferYear(dateStr, fallbackYear) {
            const m = String(dateStr || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (m) return Number(m[3]);
            return fallbackYear ? Number(fallbackYear) : null;
          }

          async function run() {
            const url = "https://www.eurojackpot.com/";

            let prevJson = {};
            let existingDraws = [];
            try {
              if (fs.existsSync("draws.json")) {
                prevJson = JSON.parse(fs.readFileSync("draws.json", "utf8"));
                if (Array.isArray(prevJson.draws)) {
                  existingDraws = prevJson.draws;
                }
              }
            } catch (_) {}

            const output = {
              source: url,
              updatedAt: new Date().toISOString(),
              fetchedOk: false,
              error: null,
              nextDrawDate: prevJson.nextDrawDate || null,
              latestDrawDate: prevJson.latestDrawDate || null,
              availableYears: [],
              datesByYear: {},
              totalDraws: 0,
              draws: []
            };

            let browser;
            try {
              browser = await chromium.launch({
                headless: true,
                args: ["--disable-blink-features=AutomationControlled"]
              });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                locale: "en-US",
                viewport: { width: 1280, height: 800 }
              });
              const page = await context.newPage();

              await page.goto(url, { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.waitForTimeout(6000);

              const cookieButtons = [
                "button:has-text(\"Accept\")",
                "button:has-text(\"Agree\")",
                "button:has-text(\"Akzeptieren\")",
                "button:has-text(\"Alle akzeptieren\")"
              ];
              for (const sel of cookieButtons) {
                const btn = page.locator(sel).first();
                if (await btn.isVisible({ timeout: 1000 }).catch(() => false)) {
                  await btn.click().catch(() => {});
                  await page.waitForTimeout(1500);
                  break;
                }
              }

              await page.waitForSelector("select[formcontrolname=\"datum\"]", { timeout: 25000 }).catch(() => {});
              await page.waitForTimeout(1500);

              async function readPageState() {
                return await page.evaluate(() => {
                  const host = document.querySelector("app-winning-numbers") || document.body;

                  const nextDateEl = host.querySelector(".next-win-date");
                  const nextDrawDate = nextDateEl ? nextDateEl.textContent.replace(/\s+/g, " ").trim() : "";

                  const yearSelect = host.querySelector("select[formcontrolname=\"jahr\"]");
                  const dateSelect = host.querySelector("select[formcontrolname=\"datum\"]");

                  const selectedYear = yearSelect && yearSelect.selectedOptions[0]
                    ? yearSelect.selectedOptions[0].text.trim()
                    : null;

                  const yearOptions = yearSelect
                    ? Array.from(yearSelect.options).map((o, idx) => ({
                        index: idx,
                        value: o.value,
                        label: o.text.trim()
                      }))
                    : [];

                  const selectedDateLabel = dateSelect && dateSelect.selectedOptions[0]
                    ? dateSelect.selectedOptions[0].text.trim()
                    : null;

                  const dateOptions = dateSelect
                    ? Array.from(dateSelect.options).map((o, idx) => ({
                        index: idx,
                        value: o.value,
                        label: o.text.trim()
                      }))
                    : [];

                  const dateRect = dateSelect ? dateSelect.getBoundingClientRect() : { bottom: 0 };
                  const allEls = Array.from(host.querySelectorAll("*"));

                  let lowerBoundTop = Infinity;
                  for (const el of allEls) {
                    const t = (el.textContent || "").trim();
                    if (/^(Show video|Prize breakdown)$/i.test(t) && el.children.length === 0) {
                      const r = el.getBoundingClientRect();
                      if (r.top > dateRect.bottom && r.top < lowerBoundTop) {
                        lowerBoundTop = r.top;
                      }
                    }
                  }

                  const balls = [];
                  for (const el of allEls) {
                    if (el.children.length > 0) continue;
                    if (el.closest("select") || el.closest("table")) continue;

                    const style = window.getComputedStyle(el);
                    if (style.display === "none" || style.visibility === "hidden") continue;

                    const txt = (el.textContent || "").trim();
                    if (/^([1-9]|[1-4][0-9]|50)$/.test(txt)) {
                      const rect = el.getBoundingClientRect();
                      if (
                        rect.top > dateRect.bottom - 5 &&
                        rect.top < lowerBoundTop &&
                        rect.width >= 16 &&
                        rect.height >= 16
                      ) {
                        balls.push({
                          value: Number(txt),
                          top: Math.round(rect.top),
                          left: Math.round(rect.left)
                        });
                      }
                    }
                  }

                  balls.sort((a, b) => (Math.abs(a.top - b.top) <= 14 ? a.left - b.left : a.top - b.top));

                  const uniqueBalls = [];
                  for (const b of balls) {
                    const isDup = uniqueBalls.some(
                      (u) => u.value === b.value && Math.abs(u.top - b.top) <= 5 && Math.abs(u.left - b.left) <= 5
                    );
                    if (!isDup) uniqueBalls.push(b);
                  }

                  const values = uniqueBalls.map((x) => x.value);
                  const mainNumbers = values.slice(0, 5);
                  const euroNumbers = values.slice(5, 7).filter((n) => n >= 1 && n <= 12);

                  const shortMatch = selectedDateLabel ? selectedDateLabel.match(/\b(\d{2}\.\d{2}\.\d{4})\b/) : null;
                  const drawDate = shortMatch ? shortMatch[1] : selectedDateLabel;

                  return {
                    nextDrawDate,
                    selectedYear,
                    yearOptions,
                    selectedDateLabel,
                    drawDate,
                    dateOptions,
                    mainNumbers,
                    euroNumbers
                  };
                });
              }

              const initial = await readPageState();
              output.fetchedOk = true;
              if (initial.nextDrawDate) output.nextDrawDate = initial.nextDrawDate;
              if (initial.selectedDateLabel) output.latestDrawDate = initial.selectedDateLabel;

              // PASUL 1: Extragem lista anilor (2012..2026) si toate optiunile de data pentru fiecare an
              const yearEntries = (initial.yearOptions || [])
                .map((y) => ({ ...y, yearNum: Number(y.label.trim()) }))
                .filter((y) => !Number.isNaN(y.yearNum) && y.yearNum >= 2012 && y.yearNum <= 2026)
                .sort((a, b) => b.yearNum - a.yearNum);

              output.availableYears = yearEntries.map((y) => y.yearNum);

              const datesByYear = {};
              const hasYearSelect = await page.locator("select[formcontrolname=\"jahr\"]").count().then((c) => c > 0);

              for (const yEntry of yearEntries) {
                const yKey = String(yEntry.yearNum);
                if (hasYearSelect && (await readPageState()).selectedYear !== yEntry.label.trim()) {
                  await page.selectOption("select[formcontrolname=\"jahr\"]", { index: yEntry.index }).catch(() => {});
                  for (let step = 0; step < 25; step++) {
                    await page.waitForTimeout(250);
                    const check = await readPageState();
                    const firstLabel = check.dateOptions && check.dateOptions[0] ? check.dateOptions[0].label : "";
                    if (check.selectedYear === yEntry.label.trim() && firstLabel.includes(yKey)) {
                      break;
                    }
                  }
                  await page.waitForTimeout(400);
                }

                const st = await readPageState();
                datesByYear[yKey] = (st.dateOptions || []).map((opt) => ({
                  index: opt.index,
                  value: opt.value,
                  label: opt.label,
                  date: extractShortDate(opt.label)
                }));
              }

              output.datesByYear = datesByYear;

              // PASUL 2: Parcurgem pe rand fiecare an si extragem extragerile lipsa
              const collectedMap = new Map();

              function addDraw(d) {
                if (!d || !Array.isArray(d.mainNumbers) || d.mainNumbers.length !== 5) return false;
                if (!Array.isArray(d.euroNumbers) || d.euroNumbers.length !== 2) return false;
                const key = d.date || d.dateLabel;
                if (!key) return false;
                const normalizedYear = inferYear(d.date || d.dateLabel, d.year);
                if (collectedMap.has(key)) {
                  const existing = collectedMap.get(key);
                  if (existing.year !== normalizedYear && normalizedYear) {
                    collectedMap.set(key, { ...existing, year: normalizedYear });
                  }
                  return false;
                }
                collectedMap.set(key, {
                  year: normalizedYear,
                  date: d.date,
                  dateLabel: d.dateLabel || d.date,
                  mainNumbers: d.mainNumbers,
                  euroNumbers: d.euroNumbers
                });
                return true;
              }

              for (const oldDraw of existingDraws) {
                addDraw(oldDraw);
              }

              let addedThisRun = 0;
              const hasDateSelect = await page.locator("select[formcontrolname=\"datum\"]").count().then((c) => c > 0);

              for (const yEntry of yearEntries) {
                if (addedThisRun >= MAX_NEW_DRAWS_PER_RUN) break;

                const yKey = String(yEntry.yearNum);
                const optsForYear = datesByYear[yKey] || [];
                const hasMissingInYear = optsForYear.some((o) => o.date && !collectedMap.has(o.date));
                if (!hasMissingInYear) continue;

                if (hasYearSelect && (await readPageState()).selectedYear !== yEntry.label.trim()) {
                  await page.selectOption("select[formcontrolname=\"jahr\"]", { index: yEntry.index }).catch(() => {});
                  for (let step = 0; step < 25; step++) {
                    await page.waitForTimeout(250);
                    const check = await readPageState();
                    const firstLabel = check.dateOptions && check.dateOptions[0] ? check.dateOptions[0].label : "";
                    if (check.selectedYear === yEntry.label.trim() && firstLabel.includes(yKey)) {
                      break;
                    }
                  }
                  await page.waitForTimeout(500);
                }

                const curState = await readPageState();
                if (curState.drawDate && !collectedMap.has(curState.drawDate)) {
                  if (addDraw({
                    year: yEntry.yearNum,
                    date: curState.drawDate,
                    dateLabel: curState.selectedDateLabel,
                    mainNumbers: curState.mainNumbers,
                    euroNumbers: curState.euroNumbers
                  })) {
                    addedThisRun++;
                  }
                }

                if (!hasDateSelect) continue;

                for (const opt of optsForYear) {
                  if (addedThisRun >= MAX_NEW_DRAWS_PER_RUN) break;
                  if (!opt.date || collectedMap.has(opt.date)) continue;

                  const prevSig = JSON.stringify((await readPageState()).mainNumbers);
                  await page.selectOption("select[formcontrolname=\"datum\"]", { index: opt.index }).catch(() => {});

                  for (let step = 0; step < 12; step++) {
                    await page.waitForTimeout(200);
                    const chk = await readPageState();
                    if (JSON.stringify(chk.mainNumbers) !== prevSig) {
                      break;
                    }
                  }

                  const after = await readPageState();
                  if (addDraw({
                    year: yEntry.yearNum,
                    date: after.drawDate || opt.date,
                    dateLabel: after.selectedDateLabel || opt.label,
                    mainNumbers: after.mainNumbers,
                    euroNumbers: after.euroNumbers
                  })) {
                    addedThisRun++;
                  }
                }
              }

              const allDraws = Array.from(collectedMap.values()).sort((a, b) => {
                const parseDMY = (s) => {
                  const m = (s || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
                  if (!m) return 0;
                  return Number(`${m[3]}${m[2]}${m[1]}`);
                };
                return parseDMY(b.date) - parseDMY(a.date);
              });

              output.draws = allDraws;
              output.totalDraws = allDraws.length;
              if (!output.latestDrawDate && allDraws.length > 0) {
                output.latestDrawDate = allDraws[0].dateLabel || allDraws[0].date;
              }
            } catch (err) {
              output.error = err.message;
            } finally {
              if (browser) {
                await browser.close();
              }
            }

            fs.writeFileSync("draws.json", JSON.stringify(output, null, 2), "utf8");
          }

          run();
          '

      - name: Clean temporary node files
        run: rm -rf node_modules package.json package-lock.json

      - name: Commit and push draws.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          if git diff --staged --quiet; then
            echo "No changes in draws.json"
          else
            git commit -m "Update Eurojackpot draws.json"
            git push
          fi
