name: Update Eurojackpot Draws JSON

on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Extract Eurojackpot winning numbers from rendered DOM
        run: |
          node -e '
          const fs = require("fs");
          const { chromium } = require("playwright");

          async function run() {
            const url = "https://www.eurojackpot.com/";
            const output = {
              source: url,
              updatedAt: new Date().toISOString(),
              fetchedOk: false,
              error: null,
              nextDrawDate: null,
              latestDrawDate: null,
              draws: []
            };

            let browser;
            try {
              browser = await chromium.launch({
                headless: true,
                args: ["--disable-blink-features=AutomationControlled"]
              });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                locale: "en-US",
                viewport: { width: 1280, height: 800 }
              });
              const page = await context.newPage();

              await page.goto(url, { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.waitForTimeout(7000);

              const cookieButtons = [
                "button:has-text(\"Accept\")",
                "button:has-text(\"Agree\")",
                "button:has-text(\"Akzeptieren\")",
                "button:has-text(\"Alle akzeptieren\")"
              ];
              for (const sel of cookieButtons) {
                const btn = page.locator(sel).first();
                if (await btn.isVisible({ timeout: 1000 }).catch(() => false)) {
                  await btn.click().catch(() => {});
                  await page.waitForTimeout(2000);
                  break;
                }
              }

              await page.waitForTimeout(3000);

              const data = await page.evaluate(() => {
                const host = document.querySelector("app-winning-numbers") || document.body;

                // Data urmatoarei extrageri
                const nextDateEl = host.querySelector(".next-win-date");
                const nextDrawDate = nextDateEl ? nextDateEl.textContent.replace(/\s+/g, " ").trim() : null;

                // Select-urile de an si data
                const yearSelect = host.querySelector("select[formcontrolname=\"jahr\"]");
                const dateSelect = host.querySelector("select[formcontrolname=\"datum\"]");

                const selectedYear = yearSelect && yearSelect.selectedOptions[0]
                  ? yearSelect.selectedOptions[0].text.trim()
                  : null;

                const selectedDateText = dateSelect && dateSelect.selectedOptions[0]
                  ? dateSelect.selectedOptions[0].text.trim()
                  : null;

                const firstDateOptionText = dateSelect && dateSelect.options[0]
                  ? dateSelect.options[0].text.trim()
                  : null;

                const activeDateLabel = selectedDateText || firstDateOptionText || null;
                const shortDateMatch = activeDateLabel ? activeDateLabel.match(/\b(\d{2}\.\d{2}\.\d{4})\b/) : null;
                const drawDateShort = shortDateMatch ? shortDateMatch[1] : activeDateLabel;

                // Cautam toate elementele frunza (fara copii) din host care contin doar un numar 1..50
                const allEls = Array.from(host.querySelectorAll("*"));
                const leafNumbers = [];

                for (const el of allEls) {
                  if (el.children.length > 0) continue;
                  const style = window.getComputedStyle(el);
                  if (style.display === "none" || style.visibility === "hidden") continue;

                  // Ignoram optiunile din dropdown-uri (anii 2012-2026 si datele)
                  if (el.closest("select")) continue;

                  const txt = (el.textContent || "").trim();
                  if (/^([1-9]|[1-4][0-9]|50)$/.test(txt)) {
                    const rect = el.getBoundingClientRect();
                    if (rect.width > 0 && rect.height > 0) {
                      leafNumbers.push({
                        value: Number(txt),
                        top: Math.round(rect.top),
                        left: Math.round(rect.left),
                        cls: el.className || ""
                      });
                    }
                  }
                }

                // Sortam de sus in jos, apoi de la stanga la dreapta
                leafNumbers.sort((a, b) => (Math.abs(a.top - b.top) <= 10 ? a.left - b.left : a.top - b.top));

                return {
                  nextDrawDate,
                  selectedYear,
                  activeDateLabel,
                  drawDateShort,
                  leafNumbers
                };
              });

              output.fetchedOk = true;
              output.nextDrawDate = data.nextDrawDate;
              output.latestDrawDate = data.activeDateLabel;

              const nums = data.leafNumbers.map((x) => x.value);
              if (nums.length >= 7) {
                output.draws.push({
                  year: data.selectedYear ? Number(data.selectedYear) : null,
                  date: data.drawDateShort,
                  dateLabel: data.activeDateLabel,
                  mainNumbers: nums.slice(0, 5),
                  euroNumbers: nums.slice(5, 7),
                  nextDrawDate: data.nextDrawDate
                });
              } else {
                output.debugLeafNumbers = data.leafNumbers.slice(0, 20);
              }
            } catch (err) {
              output.error = err.message;
            } finally {
              if (browser) {
                await browser.close();
              }
            }

            fs.writeFileSync("draws.json", JSON.stringify(output, null, 2), "utf8");
          }

          run();
          '

      - name: Clean temporary node files
        run: rm -rf node_modules package.json package-lock.json

      - name: Commit and push draws.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          if git diff --staged --quiet; then
            echo "No changes in draws.json"
          else
            git commit -m "Update Eurojackpot draws.json"
            git push
          fi
