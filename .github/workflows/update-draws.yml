name: Update Eurojackpot Draws JSON

on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inspect EJP endpoints and probe APIs
        run: |
          node -e '
          const fs = require("fs");

          const headers = {
            "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
            "Accept": "application/json, text/plain, */*;q=0.8",
            "Accept-Language": "de-DE,de;q=0.9,en-US;q=0.8,en;q=0.7"
          };

          async function run() {
            const baseUrl = "https://www.eurojackpot.com/";
            const output = {
              source: baseUrl,
              updatedAt: new Date().toISOString(),
              ejpRoutesFound: [],
              probes: [],
              draws: []
            };

            try {
              const pageRes = await fetch(baseUrl, {
                headers: {
                  ...headers,
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
                }
              });
              const html = await pageRes.text();
              const mainJsMatch = html.match(/src=["'\'']([^"'\'']*main[^"'\'']*\.js)["'\'']/i);

              const candidates = new Set([
                "https://www.eurojackpot.com/wp-json/ejp/v1/slug/home-page",
                "https://www.eurojackpot.com/wp-json/ejp/v1/draws",
                "https://www.eurojackpot.com/wp-json/ejp/v1/results",
                "https://www.eurojackpot.com/wp-json/ejp/v1/latest",
                "https://www.eurojackpot.com/api/drawvideo/videoid"
              ]);

              if (mainJsMatch && mainJsMatch[1]) {
                const mainJsUrl = new URL(mainJsMatch[1], baseUrl).toString();
                const jsRes = await fetch(mainJsUrl, { headers: { ...headers, Accept: "*/*" } });
                if (jsRes.ok) {
                  const jsCode = await jsRes.text();
                  const ejpMatches = jsCode.match(/["'\''](\/?wp-json\/ejp\/v1\/[a-zA-Z0-9_./-]+)["'\'']/g) || [];
                  for (const m of ejpMatches) {
                    const cleanRoute = m.slice(1, -1).replace(/^\/+/, "");
                    const fullUrl = new URL(cleanRoute, baseUrl).toString();
                    output.ejpRoutesFound.push(fullUrl);
                    candidates.add(fullUrl);
                  }
                }
              }

              output.ejpRoutesFound = Array.from(new Set(output.ejpRoutesFound));

              for (const url of Array.from(candidates).slice(0, 15)) {
                try {
                  const res = await fetch(url, { headers });
                  const text = await res.text();
                  let json = null;
                  try {
                    json = JSON.parse(text);
                  } catch (_) {
                    json = null;
                  }

                  output.probes.push({
                    url,
                    status: res.status,
                    ok: res.ok,
                    isJson: Boolean(json),
                    topKeys: json && typeof json === "object" && !Array.isArray(json)
                      ? Object.keys(json).slice(0, 20)
                      : null,
                    preview: text.slice(0, 300)
                  });
                } catch (err) {
                  output.probes.push({
                    url,
                    ok: false,
                    error: err.message
                  });
                }
              }
            } catch (err) {
              output.error = err.message;
            }

            fs.writeFileSync("draws.json", JSON.stringify(output, null, 2), "utf8");
          }

          run();
          '

      - name: Commit and push draws.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          if git diff --staged --quiet; then
            echo "No changes in draws.json"
          else
            git commit -m "Update Eurojackpot draws.json"
            git push
          fi
