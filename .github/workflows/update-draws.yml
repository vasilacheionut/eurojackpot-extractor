name: Update Eurojackpot Draws JSON

on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Extract Eurojackpot winning numbers
        run: |
          node -e '
          const fs = require("fs");
          const { chromium } = require("playwright");

          async function run() {
            const url = "https://www.eurojackpot.com/";
            const output = {
              source: url,
              updatedAt: new Date().toISOString(),
              fetchedOk: false,
              error: null,
              nextDrawDate: null,
              latestDrawDate: null,
              draws: []
            };

            let browser;
            try {
              browser = await chromium.launch({
                headless: true,
                args: ["--disable-blink-features=AutomationControlled"]
              });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                locale: "en-US",
                viewport: { width: 1280, height: 800 }
              });
              const page = await context.newPage();

              await page.goto(url, { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.waitForTimeout(6000);

              const cookieButtons = [
                "button:has-text(\"Accept\")",
                "button:has-text(\"Agree\")",
                "button:has-text(\"Akzeptieren\")",
                "button:has-text(\"Alle akzeptieren\")"
              ];
              for (const sel of cookieButtons) {
                const btn = page.locator(sel).first();
                if (await btn.isVisible({ timeout: 1000 }).catch(() => false)) {
                  await btn.click().catch(() => {});
                  await page.waitForTimeout(2000);
                  break;
                }
              }

              await page.waitForTimeout(3000);

              const parsed = await page.evaluate(() => {
                const host = document.querySelector("app-winning-numbers") || document.body;
                const fullText = host ? host.innerText : "";
                const lines = fullText
                  .split(/\r?\n/)
                  .map((l) => l.trim())
                  .filter(Boolean);

                let nextDraw = null;
                const nextIdx = lines.findIndex((l) => /next chance to win/i.test(l));
                if (nextIdx !== -1 && lines[nextIdx + 1]) {
                  nextDraw = lines[nextIdx + 1];
                }

                // Cautam sectiunea Winning numbers si primele numere intregi afisate dupa selectorul de data
                const winIdx = lines.findIndex((l) => /^winning numbers$/i.test(l));
                const searchLines = winIdx !== -1 ? lines.slice(winIdx) : lines;

                // Identificam prima data de forma dd.mm.yyyy in text
                const dateMatch = fullText.match(/\b(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),\s*(\d{2}\.\d{2}\.\d{4})\b/i);
                const drawDateLabel = dateMatch ? dateMatch[0] : null;
                const drawDateShort = dateMatch ? dateMatch[2] : null;

                // Extragem elementele vizibile de tip bilă/număr din zona Winning numbers
                const candidateNumbers = [];
                const numberSelectors = [
                  ".winning-number",
                  "[class*=\"winning-number\"]",
                  "[class*=\"ball\"]",
                  "[class*=\"number\"]"
                ];

                for (const sel of numberSelectors) {
                  const nodes = Array.from(host.querySelectorAll(sel));
                  const nums = nodes
                    .map((el) => {
                      const txt = (el.textContent || "").trim();
                      if (!/^\d{1,2}$/.test(txt)) return null;
                      return Number(txt);
                    })
                    .filter((n) => n !== null && n >= 1 && n <= 50);

                  if (nums.length >= 7) {
                    return {
                      nextDraw,
                      drawDateLabel,
                      drawDateShort,
                      numbers: nums.slice(0, 7),
                      sourceSelector: sel
                    };
                  }
                }

                // Fallback pe liniile din jurul datei extragerii
                const afterDateIdx = drawDateLabel
                  ? searchLines.findIndex((l) => l.includes(drawDateLabel))
                  : 0;
                const sliceAfterDate = afterDateIdx !== -1 ? searchLines.slice(afterDateIdx + 1, afterDateIdx + 25) : searchLines.slice(0, 25);

                for (const item of sliceAfterDate) {
                  if (/^\d{1,2}$/.test(item)) {
                    const val = Number(item);
                    if (val >= 1 && val <= 50) {
                      candidateNumbers.push(val);
                    }
                  }
                  if (candidateNumbers.length >= 7) break;
                }

                return {
                  nextDraw,
                  drawDateLabel,
                  drawDateShort,
                  numbers: candidateNumbers.slice(0, 7),
                  sourceSelector: "text-fallback"
                };
              });

              output.fetchedOk = true;
              output.nextDrawDate = parsed.nextDraw;
              output.latestDrawDate = parsed.drawDateLabel;

              if (parsed.numbers && parsed.numbers.length >= 7) {
                output.draws.push({
                  date: parsed.drawDateShort || parsed.drawDateLabel,
                  dateLabel: parsed.drawDateLabel,
                  mainNumbers: parsed.numbers.slice(0, 5),
                  euroNumbers: parsed.numbers.slice(5, 7),
                  nextDrawDate: parsed.nextDraw
                });
              }
            } catch (err) {
              output.error = err.message;
            } finally {
              if (browser) {
                await browser.close();
              }
            }

            fs.writeFileSync("draws.json", JSON.stringify(output, null, 2), "utf8");
          }

          run();
          '

      - name: Clean temporary node files
        run: rm -rf node_modules package.json package-lock.json

      - name: Commit and push draws.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          if git diff --staged --quiet; then
            echo "No changes in draws.json"
          else
            git commit -m "Update Eurojackpot draws.json"
            git push
          fi
