name: Update Eurojackpot Draws JSON

on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Inspect rendered DOM like Inspect Element
        run: |
          node -e '
          const fs = require("fs");
          const { chromium } = require("playwright");

          async function run() {
            const url = "https://www.eurojackpot.com/";
            const output = {
              source: url,
              updatedAt: new Date().toISOString(),
              fetchedOk: false,
              error: null,
              pageTitle: null,
              visibleText: null,
              renderedHtmlPreview: null,
              draws: []
            };

            let browser;
            try {
              browser = await chromium.launch({
                headless: true,
                args: ["--disable-blink-features=AutomationControlled"]
              });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                locale: "de-DE",
                viewport: { width: 1280, height: 800 }
              });
              const page = await context.newPage();

              await page.goto(url, { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.waitForTimeout(6000);

              // Incercam sa inchidem eventuale bannere de cookies daca apar
              const cookieButtons = [
                "button:has-text(\"Akzeptieren\")",
                "button:has-text(\"Alle akzeptieren\")",
                "button:has-text(\"Accept\")",
                "button:has-text(\"Agree\")"
              ];
              for (const sel of cookieButtons) {
                const btn = page.locator(sel).first();
                if (await btn.isVisible({ timeout: 1000 }).catch(() => false)) {
                  await btn.click().catch(() => {});
                  await page.waitForTimeout(2000);
                  break;
                }
              }

              await page.waitForTimeout(4000);

              output.pageTitle = await page.title();

              const domData = await page.evaluate(() => {
                const text = document.body ? document.body.innerText.replace(/\s+/g, " ").trim() : "";
                const html = document.querySelector("app-winning-numbers")
                  ? document.querySelector("app-winning-numbers").outerHTML
                  : (document.body ? document.body.innerHTML : "");
                return {
                  text,
                  html
                };
              });

              output.visibleText = domData.text.slice(0, 1500);
              output.renderedHtmlPreview = domData.html.slice(0, 1500);
              output.fetchedOk = true;
            } catch (err) {
              output.error = err.message;
            } finally {
              if (browser) {
                await browser.close();
              }
            }

            fs.writeFileSync("draws.json", JSON.stringify(output, null, 2), "utf8");
          }

          run();
          '

      - name: Clean temporary node files
        run: rm -rf node_modules package.json package-lock.json

      - name: Commit and push draws.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          if git diff --staged --quiet; then
            echo "No changes in draws.json"
          else
            git commit -m "Update Eurojackpot draws.json"
            git push
          fi
