name: Update Eurojackpot Draws JSON

on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch:
    inputs:
      years_range:
        description: "Optional years (e.g. 2026, 2024-2022). Leave empty: all years on 1st run, current year after."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch-draws:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Fetch Eurojackpot draws from years-dates.json
        env:
          YEARS_RANGE: ${{ inputs.years_range }}
        run: |
          node -e '
          const fs = require("fs");
          const { chromium } = require("playwright");

          function parseDMYToNum(dateStr) {
            const m = String(dateStr || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (!m) return 0;
            return Number(`${m[3]}${m[2]}${m[1]}`);
          }

          function inferCalendarYear(dateStr, fallbackYear) {
            const m = String(dateStr || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (m) return Number(m[3]);
            return fallbackYear ? Number(fallbackYear) : null;
          }

          function isValidDraw(d) {
            if (!d || !/^\d{2}\.\d{2}\.\d{4}$/.test(String(d.date || ""))) return false;
            const year = inferCalendarYear(d.date, d.year);
            if (!year) return false;
            if (!Array.isArray(d.mainNumbers) || d.mainNumbers.length !== 5) return false;
            if (!Array.isArray(d.euroNumbers) || d.euroNumbers.length !== 2) return false;

            const mainSet = new Set(d.mainNumbers);
            if (mainSet.size !== 5 || d.mainNumbers.some((n) => !Number.isInteger(n) || n < 1 || n > 50)) {
              return false;
            }
            const euroSet = new Set(d.euroNumbers);
            if (euroSet.size !== 2 || d.euroNumbers.some((n) => !Number.isInteger(n) || n < 1 || n > 12)) {
              return false;
            }
            return true;
          }

          function loadYearsDatesMap() {
            const map = new Map();
            if (fs.existsSync("years-dates.json")) {
              const raw = JSON.parse(fs.readFileSync("years-dates.json", "utf8"));
              if (Array.isArray(raw.years)) {
                for (const item of raw.years) {
                  if (item && item.year && Array.isArray(item.dates)) {
                    map.set(Number(item.year), new Set(item.dates));
                  }
                }
              }
            }
            return map;
          }

          function saveYearsDatesMap(map) {
            const years = Array.from(map.entries())
              .sort((a, b) => a[0] - b[0])
              .map(([year, set]) => ({
                year,
                dates: Array.from(set).sort((a, b) => parseDMYToNum(a) - parseDMYToNum(b))
              }));
            fs.writeFileSync("years-dates.json", JSON.stringify({ years }, null, 2), "utf8");
          }

          function parseYearsToRun(rangeStr, allYearsSorted, hasExistingDraws) {
            const raw = String(rangeStr || "").trim();

            if (!raw) {
              if (!hasExistingDraws) {
                console.log("No existing draws found -> running all years from index.");
                return allYearsSorted;
              }
              const currentYear = Number(new Date().getFullYear());
              console.log(`Existing draws found -> updating current year (${currentYear}).`);
              return allYearsSorted.includes(currentYear) ? [currentYear] : [currentYear];
            }

            const parts = raw.split(",").map((p) => p.trim()).filter(Boolean);
            const set = new Set();

            for (const part of parts) {
              const rangeMatch = part.match(/^(\d{4})\s*-\s*(\d{4})$/);
              if (rangeMatch) {
                const a = Number(rangeMatch[1]);
                const b = Number(rangeMatch[2]);
                const hi = Math.max(a, b);
                const lo = Math.min(a, b);
                for (let y = lo; y <= hi; y++) set.add(y);
              } else if (/^\d{4}$/.test(part)) {
                set.add(Number(part));
              }
            }

            return Array.from(set).sort((a, b) => a - b);
          }

          async function selectDropdownByTextOrValue(page, selector, matchers) {
            const sel = page.locator(selector).first();
            for (const m of matchers) {
              if (m.value) {
                const ok = await sel.selectOption({ value: m.value }, { timeout: 4000 }).then(() => true).catch(() => false);
                if (ok) {
                  await sel.evaluate((el) => {
                    el.dispatchEvent(new Event("input", { bubbles: true }));
                    el.dispatchEvent(new Event("change", { bubbles: true }));
                  });
                  return true;
                }
              }
              if (m.label) {
                const ok = await sel.selectOption({ label: m.label }, { timeout: 4000 }).then(() => true).catch(() => false);
                if (ok) {
                  await sel.evaluate((el) => {
                    el.dispatchEvent(new Event("input", { bubbles: true }));
                    el.dispatchEvent(new Event("change", { bubbles: true }));
                  });
                  return true;
                }
              }
            }

            return sel.evaluate((el, list) => {
              for (const m of list) {
                const opt = Array.from(el.options).find((o) => {
                  const val = (o.value || "").trim();
                  const txt = (o.textContent || "").trim();
                  return (m.value && val === m.value) ||
                         (m.label && txt === m.label) ||
                         (m.contains && txt.includes(m.contains));
                });
                if (opt) {
                  el.value = opt.value;
                  opt.selected = true;
                  el.dispatchEvent(new Event("input", { bubbles: true }));
                  el.dispatchEvent(new Event("change", { bubbles: true }));
                  return true;
                }
              }
              return false;
            }, matchers);
          }

          async function readWinningNumbers(page) {
            return page.evaluate(() => {
              const host = document.querySelector("app-winning-numbers") || document.body;
              const els = Array.from(host.querySelectorAll(".winning-number"));
              const nums = els
                .map((el) => Number((el.textContent || "").trim()))
                .filter((n) => !Number.isNaN(n));
              return {
                mainNumbers: nums.slice(0, 5),
                euroNumbers: nums.slice(5, 7)
              };
            });
          }

          async function run() {
            const yearsMap = loadYearsDatesMap();
            if (yearsMap.size === 0) {
              throw new Error("years-dates.json is missing or empty. Run build-years-dates workflow first.");
            }

            const drawsMap = new Map();
            if (fs.existsSync("draws.json")) {
              try {
                const prev = JSON.parse(fs.readFileSync("draws.json", "utf8"));
                if (Array.isArray(prev.draws)) {
                  for (const item of prev.draws) {
                    if (isValidDraw(item)) {
                      drawsMap.set(item.date, {
                        year: inferCalendarYear(item.date, item.year),
                        date: item.date,
                        mainNumbers: item.mainNumbers,
                        euroNumbers: item.euroNumbers
                      });
                    }
                  }
                }
              } catch (e) {
                console.error("Warning reading draws.json:", e.message);
              }
            }

            const hasExistingDraws = drawsMap.size > 0;
            console.log("Loaded valid existing draws:", drawsMap.size);

            function saveDrawsJson() {
              const draws = Array.from(drawsMap.values()).sort(
                (a, b) => parseDMYToNum(b.date) - parseDMYToNum(a.date)
              );
              fs.writeFileSync("draws.json", JSON.stringify({ draws }, null, 2), "utf8");
              return draws.length;
            }

            const allYearsSorted = Array.from(yearsMap.keys()).sort((a, b) => a - b);
            const yearsToProcess = parseYearsToRun(process.env.YEARS_RANGE, allYearsSorted, hasExistingDraws);
            console.log("Years to process:", yearsToProcess.join(", "));

            const currentCalendarYear = Number(new Date().getFullYear());
            let browser;

            try {
              browser = await chromium.launch({
                headless: true,
                args: ["--disable-blink-features=AutomationControlled"]
              });
              const context = await browser.newContext({
                userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                locale: "en-US",
                viewport: { width: 1280, height: 800 }
              });
              const page = await context.newPage();

              await page.goto("https://www.eurojackpot.com/", { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.waitForSelector("select[formcontrolname=\"jahr\"]", { timeout: 30000 });
              await page.waitForTimeout(1500);

              const cookieButtons = [
                "button:has-text(\"Accept\")",
                "button:has-text(\"Agree\")",
                "button:has-text(\"Akzeptieren\")",
                "button:has-text(\"Alle akzeptieren\")"
              ];
              for (const sel of cookieButtons) {
                const btn = page.locator(sel).first();
                if (await btn.isVisible({ timeout: 1000 }).catch(() => false)) {
                  await btn.click({ force: true }).catch(() => {});
                  await page.waitForTimeout(1000);
                  break;
                }
              }

              let lastNumbersKey = "";

              for (const yr of yearsToProcess) {
                const okYear = await selectDropdownByTextOrValue(page, "select[formcontrolname=\"jahr\"]", [
                  { value: String(yr), label: String(yr), contains: String(yr) }
                ]);
                if (!okYear) {
                  console.error(`Could not select year ${yr} on site.`);
                  continue;
                }
                await page.waitForTimeout(500);

                const dateSet = yearsMap.get(yr) || new Set();

                // If running current year, also sync any newly added dates from site dropdown
                if (yr === currentCalendarYear) {
                  const siteDates = await page.locator("select[formcontrolname=\"datum\"] option").evaluateAll((opts) =>
                    opts
                      .map((o) => {
                        const txt = (o.textContent || "").trim();
                        const m = txt.match(/\b(\d{2}\.\d{2}\.\d{4})\b/);
                        if (m) return m[1];
                        const iso = String(o.value || "").trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
                        if (iso) return `${iso[3]}.${iso[2]}.${iso[1]}`;
                        return null;
                      })
                      .filter(Boolean)
                  );
                  for (const sd of siteDates) {
                    dateSet.add(sd);
                  }
                  yearsMap.set(yr, dateSet);
                  saveYearsDatesMap(yearsMap);
                }

                const orderedDates = Array.from(dateSet).sort((a, b) => parseDMYToNum(a) - parseDMYToNum(b));
                let fetchedCount = 0;
                let skippedCount = 0;

                for (const dt of orderedDates) {
                  if (drawsMap.has(dt) && yr !== currentCalendarYear) {
                    skippedCount++;
                    continue;
                  }

                  const [dd, mm, yyyy] = dt.split(".");
                  const isoVal = `${yyyy}-${mm}-${dd}`;
                  const okDate = await selectDropdownByTextOrValue(page, "select[formcontrolname=\"datum\"]", [
                    { value: isoVal, label: dt, contains: dt }
                  ]);
                  if (!okDate) {
                    console.error(`Could not select date ${dt} in year ${yr}.`);
                    continue;
                  }

                  let parsed = null;
                  for (let attempt = 0; attempt < 12; attempt++) {
                    await page.waitForTimeout(150);
                    const cur = await readWinningNumbers(page);
                    const key = `${cur.mainNumbers.join(",")}|${cur.euroNumbers.join(",")}`;
                    if (cur.mainNumbers.length === 5 && cur.euroNumbers.length === 2 && key !== lastNumbersKey) {
                      lastNumbersKey = key;
                      parsed = cur;
                      break;
                    }
                    if (attempt >= 5 && cur.mainNumbers.length === 5 && cur.euroNumbers.length === 2) {
                      parsed = cur;
                      break;
                    }
                  }

                  if (parsed) {
                    const candidate = {
                      year: inferCalendarYear(dt, yr),
                      date: dt,
                      mainNumbers: parsed.mainNumbers,
                      euroNumbers: parsed.euroNumbers
                    };
                    if (isValidDraw(candidate)) {
                      drawsMap.set(dt, candidate);
                      fetchedCount++;
                    }
                  }
                }

                const savedTotal = saveDrawsJson();
                console.log(`Year ${yr}: fetched=${fetchedCount}, skipped=${skippedCount}, total draws=${savedTotal}`);
              }
            } catch (err) {
              console.error("Fatal error:", err.message);
              process.exitCode = 1;
            } finally {
              if (browser) {
                await browser.close();
              }
            }

            const finalCount = saveDrawsJson();
            console.log("Final draws count:", finalCount);
          }

          run();
          '

      - name: Validate draws.json integrity
        run: |
          node -e '
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("draws.json", "utf8"));
          if (!data || !Array.isArray(data.draws) || data.draws.length === 0) {
            throw new Error("draws.json is empty or missing draws array");
          }

          const seenDates = new Set();
          const byYear = {};

          for (const d of data.draws) {
            if (!/^\d{2}\.\d{2}\.\d{4}$/.test(String(d.date || ""))) {
              throw new Error(`Invalid date format: ${d.date}`);
            }
            if (seenDates.has(d.date)) {
              throw new Error(`Duplicate date: ${d.date}`);
            }
            seenDates.add(d.date);

            const calYear = Number(d.date.slice(-4));
            if (Number(d.year) !== calYear) {
              throw new Error(`Year mismatch on ${d.date}: year=${d.year}`);
            }

            if (!Array.isArray(d.mainNumbers) || d.mainNumbers.length !== 5) {
              throw new Error(`Invalid mainNumbers on ${d.date}`);
            }
            const mainSet = new Set(d.mainNumbers);
            if (mainSet.size !== 5 || d.mainNumbers.some((n) => !Number.isInteger(n) || n < 1 || n > 50)) {
              throw new Error(`Out of range/duplicate mainNumbers on ${d.date}`);
            }

            if (!Array.isArray(d.euroNumbers) || d.euroNumbers.length !== 2) {
              throw new Error(`Invalid euroNumbers on ${d.date}`);
            }
            const euroSet = new Set(d.euroNumbers);
            if (euroSet.size !== 2 || d.euroNumbers.some((n) => !Number.isInteger(n) || n < 1 || n > 12)) {
              throw new Error(`Out of range/duplicate euroNumbers on ${d.date}`);
            }

            byYear[d.year] = (byYear[d.year] || 0) + 1;
          }

          console.log("Validation passed. Total draws:", data.draws.length);
          console.log("Draws per year:", byYear);
          '

      - name: Clean temporary node files
        run: rm -rf node_modules package.json package-lock.json

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json years-dates.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Eurojackpot draws.json"
            git push
          fi
