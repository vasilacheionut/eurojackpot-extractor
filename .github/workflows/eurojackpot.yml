name: Eurojackpot Scraper (Python)

on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch:
    inputs:
      years_range:
        description: "Optional years (e.g. 2026, 2026-2022). Empty = all years."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright & Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch years, dates, and draws
        env:
          YEARS_RANGE: ${{ inputs.years_range }}
        run: python scraper.py

      - name: Validate draws.json
        run: python validate_draws.py

      - name: Commit and push updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add years-dates.json draws.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Eurojackpot data (Python)"
            git push
          fi
