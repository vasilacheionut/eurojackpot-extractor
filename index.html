<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Eurojackpot" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>Eurojackpot — Extrageri, Generator, Matrice & JSON</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #020617;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-text: #ffffff;
      --secondary: #334155;
      --secondary-hover: #475569;
      --accent: #38bdf8;
      --digit-diff: #a78bfa;
      --euro-bg: #eab308;
      --euro-text: #0f172a;

      /* Culori paritate pe cifre */
      --pp-bg: #1e3a8a;
      --pp-fg: #eff6ff;
      --pi-bg: #16a34a;
      --pi-fg: #f0fdf4;
      --ip-bg: #ea580c;
      --ip-fg: #fff7ed;
      --ii-bg: #dc2626;
      --ii-fg: #fef2f2;
    }

    html[data-theme="light"] {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-text: #ffffff;
      --secondary: #e2e8f0;
      --secondary-hover: #cbd5e1;
      --accent: #0284c7;
      --digit-diff: #7c3aed;
      --euro-bg: #eab308;
      --euro-text: #0f172a;

      --pp-bg: #1e3a8a;
      --pp-fg: #ffffff;
      --pi-bg: #15803d;
      --pi-fg: #ffffff;
      --ip-bg: #c2410c;
      --ip-fg: #ffffff;
      --ii-bg: #b91c1c;
      --ii-fg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand-link {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 2px;
      border-radius: 6px;
    }

    .brand-link:hover,
    .brand-link:active {
      color: var(--accent);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .install-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background-color: var(--primary);
      color: var(--primary-text);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .theme-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--surface-2);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .meta-strip {
      padding: 8px 16px;
      font-size: 0.85rem;
      color: var(--muted);
      background-color: var(--surface-2);
      border-bottom: 1px solid var(--border);
      line-height: 1.4;
      flex-shrink: 0;
    }

    .meta-strip strong {
      color: var(--text);
    }

    .main-content {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-bottom: 64px;
    }

    .tab-panel {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .tab-panel.active {
      display: flex;
    }

    /* Clase uniforme PP / PI / IP / II */
    .parity-PP {
      background-color: var(--pp-bg) !important;
      color: var(--pp-fg) !important;
    }

    .parity-PI {
      background-color: var(--pi-bg) !important;
      color: var(--pi-fg) !important;
    }

    .parity-IP {
      background-color: var(--ip-bg) !important;
      color: var(--ip-fg) !important;
    }

    .parity-II {
      background-color: var(--ii-bg) !important;
      color: var(--ii-fg) !important;
    }

    /* Tab 1: Extrageri */
    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .filter-row label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    select {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--surface-2);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      min-width: 110px;
    }

    .diff-filters-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .diff-filter-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .diff-filter-item label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
    }

    .diff-filter-item select {
      width: 100%;
      min-width: 0;
      padding: 6px 8px;
      font-size: 0.85rem;
    }

    .reset-filters-btn {
      align-self: flex-end;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--secondary);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-filters-btn:hover {
      background-color: var(--secondary-hover);
    }

    .draws-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 10px 88px;
      scroll-padding-bottom: 88px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .draw-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .draw-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .draw-date {
      font-size: 1rem;
      font-weight: 700;
    }

    .draw-year {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }

    .draw-matrix {
      display: grid;
      grid-template-columns:
        28px 24px
        28px 24px
        28px 24px
        28px 24px
        28px
        6px
        28px 24px
        28px;
      row-gap: 3px;
      column-gap: 0px;
      align-items: center;
      justify-items: center;
      align-self: flex-start;
      max-width: 100%;
    }

    .ball {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      background-color: var(--secondary);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .sep {
      color: var(--muted);
      font-weight: 700;
      font-size: 0.8rem;
    }

    .diff-ball {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      background-color: var(--surface-2);
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .diff-ball.euro {
      color: var(--euro-bg);
    }

    .digit-diff-ball {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background-color: var(--surface-2);
      color: var(--digit-diff);
      border: 1px solid var(--border);
    }

    /* Tab 2: Generator */
    .generator-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 16px 88px;
      scroll-padding-bottom: 88px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .gen-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gen-label {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      text-align: center;
    }

    .balls-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 54px;
    }

    .gen-ball {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.25rem;
      font-weight: 700;
      border: 2px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 -3px 7px rgba(0, 0, 0, 0.3), 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .gen-diffs-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 34px;
      min-height: 30px;
    }

    .gen-diff-ball {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background-color: var(--surface-2);
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .gen-diff-ball.euro {
      color: var(--euro-bg);
    }

    .gen-actions {
      display: flex;
      gap: 10px;
    }

    .btn-generate {
      flex: 1;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background-color: var(--primary);
      color: var(--primary-text);
      cursor: pointer;
    }

    .btn-generate:hover {
      background-color: var(--primary-hover);
    }

    .btn-copy-gen {
      flex: 0.55;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background-color: var(--secondary);
      color: var(--text);
      cursor: pointer;
    }

    .btn-copy-gen:hover {
      background-color: var(--secondary-hover);
    }

    .history-box {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .history-title {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .history-list {
      list-style: none;
      max-height: 190px;
      overflow-y: auto;
      font-size: 0.9rem;
      color: var(--text);
    }

    .history-list li {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .history-list li:last-child {
      border-bottom: none;
    }

    .mini-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      padding: 0 5px;
      border-radius: 50%;
      font-size: 0.78rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-right: 3px;
    }

    .history-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Tab 3: Matrice 1-50, Distanțe cifre & Paritate PP/PI/IP/II */
    .matrix-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 12px 88px;
      scroll-padding-bottom: 88px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .matrix-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .matrix-card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .matrix-card-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .board-1-50 {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 5px;
    }

    .board-num {
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .legend-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .legend-item {
      background-color: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .legend-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .badge-parity {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .color-name {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--muted);
    }

    .legend-nums {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      line-height: 1.35;
    }

    .digit-diff-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .digit-diff-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 8px;
      background-color: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .digit-diff-key {
      font-weight: 800;
      color: var(--accent);
      min-width: 24px;
      font-variant-numeric: tabular-nums;
    }

    .digit-diff-vals {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
    }

    /* Tab 4: JSON */
    .json-panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 12px 16px;
      gap: 10px;
    }

    textarea {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--surface-2);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      line-height: 1.4;
      resize: none;
    }

    .json-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--primary-text);
    }

    .btn-secondary {
      background-color: var(--secondary);
      color: var(--text);
    }

    .status {
      font-size: 0.85rem;
      color: var(--accent);
      min-height: 18px;
      flex-shrink: 0;
    }

    /* Navigare jos */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      display: flex;
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      z-index: 20;
    }

    .nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    .nav-btn.active {
      color: var(--primary);
      border-top: 3px solid var(--primary);
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
      font-size: 0.95rem;
    }

    @media (min-width: 768px) {
      .draws-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: start;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <a href="./" class="brand-link" id="brand-reload-link" title="Reîncarcă pagina">Eurojackpot</a>
      <div class="top-actions">
        <button type="button" class="install-btn" id="install-btn" hidden>Instalează</button>
        <button type="button" class="theme-btn" id="theme-btn">Temă: Întunecat</button>
      </div>
    </header>

    <div class="meta-strip" id="meta-info">Se încarcă draws.json...</div>

    <main class="main-content">
      <!-- TAB 1: EXTRAGERI -->
      <section class="tab-panel active" id="panel-draws" role="tabpanel">
        <div class="filter-bar">
          <div class="filter-row">
            <label for="year-filter">An (2026–2012):</label>
            <select id="year-filter">
              <option value="ALL">Toți anii</option>
            </select>
          </div>
          <div class="diff-filters-grid">
            <div class="diff-filter-item">
              <label for="main-diff-filter">Dist. 4 bile (5 nr.)</label>
              <select id="main-diff-filter">
                <option value="ALL">Toate</option>
              </select>
            </div>
            <div class="diff-filter-item">
              <label for="euro-diff-filter">Dist. 2 stele</label>
              <select id="euro-diff-filter">
                <option value="ALL">Toate</option>
              </select>
            </div>
            <button type="button" class="reset-filters-btn" id="reset-filters-btn">Reset</button>
          </div>
        </div>
        <div class="draws-list" id="draws-list">
          <div class="empty-msg">Se încarcă extragerile...</div>
        </div>
      </section>

      <!-- TAB 2: GENERATOR -->
      <section class="tab-panel" id="panel-generator" role="tabpanel">
        <div class="generator-body">
          <div class="gen-section">
            <span class="gen-label">5 Numere Principale (1 – 50)</span>
            <div class="balls-row" id="main-numbers"></div>
            <div class="gen-diffs-row" id="main-diffs"></div>
          </div>

          <div class="gen-section">
            <span class="gen-label">2 Numere Stea (1 – 12)</span>
            <div class="balls-row" id="bonus-numbers"></div>
            <div class="gen-diffs-row" id="bonus-diffs"></div>
          </div>

          <div class="gen-actions">
            <button type="button" class="btn-generate" id="generate-btn">Generează</button>
            <button type="button" class="btn-copy-gen" id="copy-gen-btn">Copiază</button>
          </div>

          <div class="history-box">
            <div class="history-title">Ultimele variante generate:</div>
            <ul class="history-list" id="history-list"></ul>
          </div>
        </div>
      </section>

      <!-- TAB 3: MATRICE (1-50, DISTANȚE CIFRE, PARITATE PP/PI/IP/II) -->
      <section class="tab-panel" id="panel-matrix" role="tabpanel">
        <div class="matrix-body">
          <div class="matrix-card">
            <div class="matrix-card-title">
              <span>Panou numere (1 – 50)</span>
              <span class="matrix-card-sub">PP · PI · IP · II</span>
            </div>
            <div class="board-1-50" id="board-1-50"></div>
          </div>

          <div class="matrix-card">
            <div class="matrix-card-title">
              <span>Paritate pe cifre (01–50)</span>
              <span class="matrix-card-sub">P = Par · I = Impar</span>
            </div>
            <div class="legend-grid" id="parity-legend"></div>
          </div>

          <div class="matrix-card">
            <div class="matrix-card-title">
              <span>Distanța între cifre (|c1 − c2|)</span>
              <span class="matrix-card-sub">01–09 = 0 + cifră</span>
            </div>
            <div class="digit-diff-list" id="digit-diff-list"></div>
          </div>
        </div>
      </section>

      <!-- TAB 4: JSON -->
      <section class="tab-panel" id="panel-json" role="tabpanel">
        <div class="json-panel-body">
          <textarea id="json-view" readonly></textarea>
          <div class="json-actions">
            <button type="button" class="action-btn btn-primary" id="reload-btn">Reîncarcă JSON</button>
            <button type="button" class="action-btn btn-secondary" id="copy-btn">Copiază JSON</button>
          </div>
          <div class="status" id="status-msg"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" role="tablist">
      <button type="button" class="nav-btn active" id="tab-draws-btn" role="tab" aria-selected="true">
        Extrageri
      </button>
      <button type="button" class="nav-btn" id="tab-generator-btn" role="tab" aria-selected="false">
        Generator
      </button>
      <button type="button" class="nav-btn" id="tab-matrix-btn" role="tab" aria-selected="false">
        Matrice
      </button>
      <button type="button" class="nav-btn" id="tab-json-btn" role="tab" aria-selected="false">
        JSON
      </button>
    </nav>
  </div>

  <script>
    (function () {
      let allDrawsDesc = [];
      let currentMain = [];
      let currentBonus = [];
      let deferredPrompt = null;

      function setStatus(msg) {
        document.getElementById("status-msg").textContent = msg;
      }

      function reloadPage(e) {
        if (e) e.preventDefault();
        window.location.reload();
      }

      function toggleTheme() {
        const html = document.documentElement;
        const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        document.getElementById("theme-btn").textContent =
          next === "dark" ? "Temă: Întunecat" : "Temă: Deschis";
      }

      function switchTab(tabName) {
        const tabs = ["draws", "generator", "matrix", "json"];
        tabs.forEach(function (t) {
          const active = t === tabName;
          const btn = document.getElementById("tab-" + t + "-btn");
          const panel = document.getElementById("panel-" + t);
          if (btn) {
            btn.classList.toggle("active", active);
            btn.setAttribute("aria-selected", String(active));
          }
          if (panel) {
            panel.classList.toggle("active", active);
          }
        });
      }

      /* --- PWA INSTALL & SERVICE WORKER --- */
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredPrompt = e;
        const installBtn = document.getElementById("install-btn");
        if (installBtn) installBtn.hidden = false;
      });

      window.addEventListener("appinstalled", function () {
        deferredPrompt = null;
        const installBtn = document.getElementById("install-btn");
        if (installBtn) installBtn.hidden = true;
      });

      function triggerInstall() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
          deferredPrompt = null;
          const installBtn = document.getElementById("install-btn");
          if (installBtn) installBtn.hidden = true;
        });
      }

      function registerServiceWorker() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        }
      }

      /* --- EXTRAGERI, BILE DISTANȚE & DISTANȚĂ CIFRE --- */
      function computeDiffs(nums) {
        const valid = Array.isArray(nums)
          ? nums.map(Number).filter(function (n) { return Number.isFinite(n); })
          : [];
        const diffs = [];
        for (let i = 0; i < valid.length - 1; i++) {
          diffs.push(Math.abs(valid[i + 1] - valid[i]));
        }
        return diffs;
      }

      function getTwoDigits(num) {
        const clean = Math.abs(Math.trunc(Number(num))) || 0;
        const padded = String(clean).padStart(2, "0");
        const c1 = Number(padded[padded.length - 2]);
        const c2 = Number(padded[padded.length - 1]);
        return [c1, c2];
      }

      function computeDigitDiff(num) {
        const [c1, c2] = getTwoDigits(num);
        return Math.abs(c1 - c2);
      }

      function getDigitParityCode(num) {
        const [c1, c2] = getTwoDigits(num);
        const p1 = c1 % 2 === 0 ? "P" : "I";
        const p2 = c2 % 2 === 0 ? "P" : "I";
        return p1 + p2;
      }

      function parityClass(num) {
        return "parity-" + getDigitParityCode(num);
      }

      /* --- PANOU 1-50, PARITATE PP/PI/IP/II & LISTĂ DISTANȚE CIFRE --- */
      function renderMatrixTab() {
        const boardEl = document.getElementById("board-1-50");
        const legendEl = document.getElementById("parity-legend");
        const diffListEl = document.getElementById("digit-diff-list");

        const groups = {
          PP: [],
          PI: [],
          IP: [],
          II: []
        };

        const diffGroups = new Map();
        for (let d = 0; d <= 9; d++) {
          diffGroups.set(d, []);
        }

        let boardHtml = "";
        for (let n = 1; n <= 50; n++) {
          const code = getDigitParityCode(n);
          groups[code].push(n);

          const dist = computeDigitDiff(n);
          if (!diffGroups.has(dist)) diffGroups.set(dist, []);
          diffGroups.get(dist).push(n);

          boardHtml +=
            '<span class="board-num parity-' +
            code +
            '" title="' +
            n +
            " (" +
            code +
            ", dist. cifre: " +
            dist +
            ')">' +
            n +
            "</span>";
        }

        if (boardEl) boardEl.innerHTML = boardHtml;

        const parityMeta = [
          { code: "PP", label: "Bleumarin" },
          { code: "PI", label: "Verde" },
          { code: "IP", label: "Portocaliu" },
          { code: "II", label: "Roșu" }
        ];

        if (legendEl) {
          legendEl.innerHTML = parityMeta
            .map(function (item) {
              const chipsHtml = groups[item.code]
                .map(function (num) {
                  return '<span class="mini-chip parity-' + item.code + '">' + num + "</span>";
                })
                .join("");

              return (
                '<div class="legend-item">' +
                '<div class="legend-head">' +
                '<span class="badge-parity parity-' +
                item.code +
                '">' +
                item.code +
                "</span>" +
                '<span class="color-name">' +
                item.label +
                "</span>" +
                "</div>" +
                '<div class="legend-nums">' +
                chipsHtml +
                "</div>" +
                "</div>"
              );
            })
            .join("");
        }

        if (diffListEl) {
          const sortedKeys = Array.from(diffGroups.keys()).sort(function (a, b) { return a - b; });
          diffListEl.innerHTML = sortedKeys
            .map(function (k) {
              const list = diffGroups.get(k) || [];
              if (!list.length) return "";
              const chipsHtml = list
                .map(function (num) {
                  return '<span class="mini-chip ' + parityClass(num) + '">' + num + "</span>";
                })
                .join("");

              return (
                '<div class="digit-diff-row">' +
                '<span class="digit-diff-key">' +
                k +
                ":</span>" +
                '<div class="digit-diff-vals">' +
                chipsHtml +
                "</div>" +
                "</div>"
              );
            })
            .join("");
        }
      }

      function renderDrawMatrix(mainNumbers, euroNumbers) {
        const mainDiffs = computeDiffs(mainNumbers);
        const euroDiffs = computeDiffs(euroNumbers);

        let cellsHtml = "";

        mainNumbers.forEach(function (n, idx) {
          const col = idx * 2 + 1;
          const digitDiff = computeDigitDiff(n);
          cellsHtml +=
            '<span class="ball ' +
            parityClass(n) +
            '" style="grid-column:' +
            col +
            ';grid-row:1;">' +
            n +
            "</span>";
          cellsHtml +=
            '<span class="digit-diff-ball" style="grid-column:' +
            col +
            ';grid-row:3;">' +
            digitDiff +
            "</span>";
        });

        mainDiffs.forEach(function (d, idx) {
          const col = idx * 2 + 2;
          cellsHtml += '<span class="diff-ball" style="grid-column:' + col + ';grid-row:2;">' + d + "</span>";
        });

        cellsHtml += '<span class="sep" style="grid-column:10;grid-row:1;">+</span>';

        euroNumbers.forEach(function (n, idx) {
          const col = 11 + idx * 2;
          cellsHtml +=
            '<span class="ball ' +
            parityClass(n) +
            '" style="grid-column:' +
            col +
            ';grid-row:1;">' +
            n +
            "</span>";
        });

        euroDiffs.forEach(function (d, idx) {
          const col = 12 + idx * 2;
          cellsHtml += '<span class="diff-ball euro" style="grid-column:' + col + ';grid-row:2;">' + d + "</span>";
        });

        return '<div class="draw-matrix">' + cellsHtml + "</div>";
      }

      function dateToSortableInt(dateStr) {
        const m = String(dateStr || "").trim().match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        if (!m) return 0;
        return Number(m[3] + m[2] + m[1]);
      }

      function extractYear(draw) {
        if (draw && Number.isInteger(Number(draw.year)) && Number(draw.year) > 0) {
          return Number(draw.year);
        }
        const m = String(draw && draw.date ? draw.date : "").trim().match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        return m ? Number(m[3]) : 0;
      }

      function normalizeDraws(rawData) {
        const list = Array.isArray(rawData)
          ? rawData
          : Array.isArray(rawData && rawData.draws)
            ? rawData.draws
            : [];

        return list
          .map((item) => ({
            date: String(item.date || "").trim(),
            year: extractYear(item),
            mainNumbers: Array.isArray(item.mainNumbers) ? item.mainNumbers : [],
            euroNumbers: Array.isArray(item.euroNumbers) ? item.euroNumbers : []
          }))
          .filter((item) => item.date.length > 0)
          .sort((a, b) => dateToSortableInt(b.date) - dateToSortableInt(a.date));
      }

      function populateYearFilter(draws) {
        const select = document.getElementById("year-filter");
        const previousVal = select.value || "ALL";
        const yearsSet = new Set(draws.map((d) => d.year).filter((y) => y > 0));
        for (let y = 2026; y >= 2012; y--) {
          yearsSet.add(y);
        }
        const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);

        select.innerHTML = '<option value="ALL">Toți anii (2026–2012)</option>';
        for (const yr of sortedYears) {
          const opt = document.createElement("option");
          opt.value = String(yr);
          opt.textContent = String(yr);
          select.appendChild(opt);
        }

        if (Array.from(select.options).some((o) => o.value === previousVal)) {
          select.value = previousVal;
        }
      }

      function populateDiffFilters(draws) {
        const mainSelect = document.getElementById("main-diff-filter");
        const euroSelect = document.getElementById("euro-diff-filter");

        const prevMain = mainSelect.value || "ALL";
        const prevEuro = euroSelect.value || "ALL";

        const mainSet = new Set();
        const euroSet = new Set();

        draws.forEach(function (d) {
          computeDiffs(d.mainNumbers).forEach(function (val) {
            mainSet.add(val);
          });
          computeDiffs(d.euroNumbers).forEach(function (val) {
            euroSet.add(val);
          });
        });

        const sortedMain = Array.from(mainSet).sort(function (a, b) { return a - b; });
        const sortedEuro = Array.from(euroSet).sort(function (a, b) { return a - b; });

        mainSelect.innerHTML = '<option value="ALL">Toate</option>';
        sortedMain.forEach(function (val) {
          const opt = document.createElement("option");
          opt.value = String(val);
          opt.textContent = "Dist. " + val;
          mainSelect.appendChild(opt);
        });

        euroSelect.innerHTML = '<option value="ALL">Toate</option>';
        sortedEuro.forEach(function (val) {
          const opt = document.createElement("option");
          opt.value = String(val);
          opt.textContent = "Dist. " + val;
          euroSelect.appendChild(opt);
        });

        if (Array.from(mainSelect.options).some((o) => o.value === prevMain)) {
          mainSelect.value = prevMain;
        }
        if (Array.from(euroSelect.options).some((o) => o.value === prevEuro)) {
          euroSelect.value = prevEuro;
        }
      }

      function resetDiffAndYearFilters() {
        document.getElementById("year-filter").value = "ALL";
        document.getElementById("main-diff-filter").value = "ALL";
        document.getElementById("euro-diff-filter").value = "ALL";
        renderDraws();
      }

      function renderDraws() {
        const container = document.getElementById("draws-list");
        const selectedYear = document.getElementById("year-filter").value;
        const selectedMainDiff = document.getElementById("main-diff-filter").value;
        const selectedEuroDiff = document.getElementById("euro-diff-filter").value;

        const filtered = allDrawsDesc.filter(function (d) {
          if (selectedYear !== "ALL" && String(d.year) !== selectedYear) {
            return false;
          }
          if (selectedMainDiff !== "ALL") {
            const targetMain = Number(selectedMainDiff);
            const mDiffs = computeDiffs(d.mainNumbers);
            if (!mDiffs.includes(targetMain)) {
              return false;
            }
          }
          if (selectedEuroDiff !== "ALL") {
            const targetEuro = Number(selectedEuroDiff);
            const eDiffs = computeDiffs(d.euroNumbers);
            if (!eDiffs.includes(targetEuro)) {
              return false;
            }
          }
          return true;
        });

        if (!filtered.length) {
          container.innerHTML = '<div class="empty-msg">Nu există extrageri pentru filtrele selectate.</div>';
          return;
        }

        container.innerHTML = filtered
          .map((d) => {
            return `
              <div class="draw-card">
                <div class="draw-header">
                  <span class="draw-date">${d.date}</span>
                  <span class="draw-year">${d.year || "-"}</span>
                </div>
                ${renderDrawMatrix(d.mainNumbers, d.euroNumbers)}
              </div>
            `;
          })
          .join("");
      }

      function loadJsonFile() {
        setStatus("Se actualizează...");
        fetch("./draws.json?t=" + Date.now())
          .then((res) => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then((data) => {
            allDrawsDesc = normalizeDraws(data);
            populateYearFilter(allDrawsDesc);
            populateDiffFilters(allDrawsDesc);
            renderDraws();

            document.getElementById("json-view").value = JSON.stringify(data, null, 2);

            const latestDate = allDrawsDesc.length ? allDrawsDesc[0].date : "-";
            const oldestDate = allDrawsDesc.length ? allDrawsDesc[allDrawsDesc.length - 1].date : "-";

            document.getElementById("meta-info").innerHTML =
              "Extrageri: <strong>" +
              allDrawsDesc.length +
              "</strong> | Interval: <strong>" +
              latestDate +
              " → " +
              oldestDate +
              "</strong>";

            setStatus("JSON încărcat.");
          })
          .catch((err) => {
            document.getElementById("draws-list").innerHTML =
              '<div class="empty-msg">Nu s-a putut citi draws.json (' + err.message + ').</div>';
            setStatus("Eroare la citirea draws.json (" + err.message + ").");
          });
      }

      function fallbackCopyText(text) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          document.execCommand("copy");
        } catch (e) {
          // ignoră dacă nu este permis
        }
        document.body.removeChild(textarea);
      }

      function copyJson() {
        const text = document.getElementById("json-view").value;
        if (!text) {
          setStatus("Nu există conținut JSON de copiat.");
          return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(text)
            .then(() => setStatus("JSON copiat în clipboard."))
            .catch(() => {
              fallbackCopyText(text);
              setStatus("JSON copiat în clipboard.");
            });
        } else {
          fallbackCopyText(text);
          setStatus("JSON copiat în clipboard.");
        }
      }

      /* --- GENERATOR 5/50 + 2/12 --- */
      function getRandomInt(maxExclusive) {
        if (window.crypto && typeof window.crypto.getRandomValues === "function") {
          const buf = new Uint32Array(1);
          window.crypto.getRandomValues(buf);
          return buf[0] % maxExclusive;
        }
        return Math.floor(Math.random() * maxExclusive);
      }

      function drawUniqueNumbers(count, max) {
        const pool = [];
        for (let i = 1; i <= max; i++) {
          pool.push(i);
        }

        for (let i = pool.length - 1; i > 0; i--) {
          const j = getRandomInt(i + 1);
          const temp = pool[i];
          pool[i] = pool[j];
          pool[j] = temp;
        }

        return pool.slice(0, count).sort(function (a, b) {
          return a - b;
        });
      }

      function formatNumber(num) {
        return num < 10 ? "0" + num : String(num);
      }

      function renderGenBalls(containerId, numbers) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = "";

        numbers.forEach(function (num) {
          const ball = document.createElement("div");
          ball.className = "gen-ball " + parityClass(num);
          ball.textContent = formatNumber(num);
          container.appendChild(ball);
        });
      }

      function renderGenDiffs(containerId, numbers, isEuro) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const diffs = computeDiffs(numbers);

        container.innerHTML = diffs
          .map(function (d) {
            return (
              '<span class="gen-diff-ball' +
              (isEuro ? " euro" : "") +
              '">' +
              d +
              "</span>"
            );
          })
          .join("");
      }

      function addToHistory(main, bonus) {
        const list = document.getElementById("history-list");
        if (!list) return;

        const li = document.createElement("li");
        const mainHtml = main
          .map(function (n) {
            return '<span class="mini-chip ' + parityClass(n) + '">' + formatNumber(n) + "</span>";
          })
          .join("");

        const bonusHtml = bonus
          .map(function (n) {
            return '<span class="mini-chip ' + parityClass(n) + '">' + formatNumber(n) + "</span>";
          })
          .join("");

        li.innerHTML =
          '<span class="history-group">' +
          mainHtml +
          '</span><span class="history-group">★ ' +
          bonusHtml +
          "</span>";
        list.insertBefore(li, list.firstChild);

        while (list.children.length > 10) {
          list.removeChild(list.lastChild);
        }
      }

      function generateCombination() {
        currentMain = drawUniqueNumbers(5, 50);
        currentBonus = drawUniqueNumbers(2, 12);

        renderGenBalls("main-numbers", currentMain);
        renderGenBalls("bonus-numbers", currentBonus);
        renderGenDiffs("main-diffs", currentMain, false);
        renderGenDiffs("bonus-diffs", currentBonus, true);
        addToHistory(currentMain, currentBonus);
      }

      function copyGenResult() {
        if (!currentMain.length || !currentBonus.length) return;

        const text =
          currentMain.map(formatNumber).join(", ") +
          " | Stele: " +
          currentBonus.map(formatNumber).join(", ");

        const btn = document.getElementById("copy-gen-btn");

        const onCopied = function () {
          if (!btn) return;
          btn.textContent = "Copiat!";
          setTimeout(function () {
            btn.textContent = "Copiază";
          }, 1500);
        };

        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          navigator.clipboard
            .writeText(text)
            .then(onCopied)
            .catch(function () {
              fallbackCopyText(text);
              onCopied();
            });
        } else {
          fallbackCopyText(text);
          onCopied();
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        registerServiceWorker();
        renderMatrixTab();

        document.getElementById("brand-reload-link").addEventListener("click", reloadPage);
        document.getElementById("install-btn").addEventListener("click", triggerInstall);
        document.getElementById("theme-btn").addEventListener("click", toggleTheme);

        document.getElementById("tab-draws-btn").addEventListener("click", function () {
          switchTab("draws");
        });
        document.getElementById("tab-generator-btn").addEventListener("click", function () {
          switchTab("generator");
        });
        document.getElementById("tab-matrix-btn").addEventListener("click", function () {
          switchTab("matrix");
        });
        document.getElementById("tab-json-btn").addEventListener("click", function () {
          switchTab("json");
        });

        document.getElementById("year-filter").addEventListener("change", renderDraws);
        document.getElementById("main-diff-filter").addEventListener("change", renderDraws);
        document.getElementById("euro-diff-filter").addEventListener("change", renderDraws);
        document.getElementById("reset-filters-btn").addEventListener("click", resetDiffAndYearFilters);

        document.getElementById("reload-btn").addEventListener("click", loadJsonFile);
        document.getElementById("copy-btn").addEventListener("click", copyJson);

        document.getElementById("generate-btn").addEventListener("click", generateCombination);
        document.getElementById("copy-gen-btn").addEventListener("click", copyGenResult);

        generateCombination();
        loadJsonFile();
      });
    })();
  </script>
</body>
</html>
