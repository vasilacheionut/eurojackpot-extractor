<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Eurojackpot — Extrageri & JSON</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #020617;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-text: #ffffff;
      --secondary: #334155;
      --accent: #38bdf8;
      --euro-bg: #eab308;
      --euro-text: #0f172a;
    }

    html[data-theme="light"] {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --primary-text: #ffffff;
      --secondary: #e2e8f0;
      --accent: #0284c7;
      --euro-bg: #eab308;
      --euro-text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .top-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .theme-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--surface-2);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .meta-strip {
      padding: 8px 16px;
      font-size: 0.85rem;
      color: var(--muted);
      background-color: var(--surface-2);
      border-bottom: 1px solid var(--border);
      line-height: 1.4;
      flex-shrink: 0;
    }

    .meta-strip strong {
      color: var(--text);
    }

    .main-content {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-bottom: 72px;
    }

    .tab-panel {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .tab-panel.active {
      display: flex;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .filter-bar label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    select {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--surface-2);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      min-width: 150px;
    }

    .draws-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .draw-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .draw-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .draw-date {
      font-size: 1rem;
      font-weight: 700;
    }

    .draw-year {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }

    .balls-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .ball {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
      background-color: var(--secondary);
      color: var(--text);
    }

    .ball.euro {
      background-color: var(--euro-bg);
      color: var(--euro-text);
    }

    .sep {
      color: var(--muted);
      font-weight: 700;
      font-size: 1rem;
      margin: 0 2px;
    }

    .json-panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 16px;
      gap: 10px;
    }

    textarea {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--surface-2);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
      resize: none;
    }

    .json-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .action-btn {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--primary-text);
    }

    .btn-secondary {
      background-color: var(--secondary);
      color: var(--text);
    }

    .status {
      font-size: 0.85rem;
      color: var(--accent);
      min-height: 18px;
      flex-shrink: 0;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      display: flex;
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      z-index: 20;
    }

    .nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn.active {
      color: var(--primary);
      border-top: 3px solid var(--primary);
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
      font-size: 0.95rem;
    }

    @media (min-width: 768px) {
      .draws-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: start;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="top-title">Eurojackpot</div>
      <button type="button" class="theme-btn" id="theme-btn">Temă: Întunecat</button>
    </header>

    <div class="meta-strip" id="meta-info">Se încarcă draws.json...</div>

    <main class="main-content">
      <section class="tab-panel active" id="panel-draws" role="tabpanel">
        <div class="filter-bar">
          <label for="year-filter">An (2026–2012):</label>
          <select id="year-filter">
            <option value="ALL">Toți anii</option>
          </select>
        </div>
        <div class="draws-list" id="draws-list">
          <div class="empty-msg">Se încarcă extragerile...</div>
        </div>
      </section>

      <section class="tab-panel" id="panel-json" role="tabpanel">
        <div class="json-panel-body">
          <textarea id="json-view" readonly></textarea>
          <div class="json-actions">
            <button type="button" class="action-btn btn-primary" id="reload-btn">Reîncarcă JSON</button>
            <button type="button" class="action-btn btn-secondary" id="copy-btn">Copiază JSON</button>
          </div>
          <div class="status" id="status-msg"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" role="tablist">
      <button type="button" class="nav-btn active" id="tab-draws-btn" role="tab" aria-selected="true">
        Extrageri
      </button>
      <button type="button" class="nav-btn" id="tab-json-btn" role="tab" aria-selected="false">
        JSON
      </button>
    </nav>
  </div>

  <script>
    (function () {
      let allDrawsDesc = [];

      function setStatus(msg) {
        document.getElementById("status-msg").textContent = msg;
      }

      function toggleTheme() {
        const html = document.documentElement;
        const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        document.getElementById("theme-btn").textContent =
          next === "dark" ? "Temă: Întunecat" : "Temă: Deschis";
      }

      function switchTab(tabName) {
        const isDraws = tabName === "draws";
        document.getElementById("tab-draws-btn").classList.toggle("active", isDraws);
        document.getElementById("tab-draws-btn").setAttribute("aria-selected", String(isDraws));
        document.getElementById("tab-json-btn").classList.toggle("active", !isDraws);
        document.getElementById("tab-json-btn").setAttribute("aria-selected", String(!isDraws));

        document.getElementById("panel-draws").classList.toggle("active", isDraws);
        document.getElementById("panel-json").classList.toggle("active", !isDraws);
      }

      function dateToSortableInt(dateStr) {
        const m = String(dateStr || "").trim().match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        if (!m) return 0;
        return Number(m[3] + m[2] + m[1]);
      }

      function extractYear(draw) {
        if (draw && Number.isInteger(Number(draw.year)) && Number(draw.year) > 0) {
          return Number(draw.year);
        }
        const m = String(draw && draw.date ? draw.date : "").trim().match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        return m ? Number(m[3]) : 0;
      }

      function normalizeDraws(rawData) {
        const list = Array.isArray(rawData)
          ? rawData
          : Array.isArray(rawData && rawData.draws)
            ? rawData.draws
            : [];

        return list
          .map((item) => ({
            date: String(item.date || "").trim(),
            year: extractYear(item),
            mainNumbers: Array.isArray(item.mainNumbers) ? item.mainNumbers : [],
            euroNumbers: Array.isArray(item.euroNumbers) ? item.euroNumbers : []
          }))
          .filter((item) => item.date.length > 0)
          .sort((a, b) => dateToSortableInt(b.date) - dateToSortableInt(a.date));
      }

      function populateYearFilter(draws) {
        const select = document.getElementById("year-filter");
        const previousVal = select.value || "ALL";
        const yearsSet = new Set(draws.map((d) => d.year).filter((y) => y > 0));
        for (let y = 2026; y >= 2012; y--) {
          yearsSet.add(y);
        }
        const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);

        select.innerHTML = '<option value="ALL">Toți anii (2026–2012)</option>';
        for (const yr of sortedYears) {
          const opt = document.createElement("option");
          opt.value = String(yr);
          opt.textContent = String(yr);
          select.appendChild(opt);
        }

        if (Array.from(select.options).some((o) => o.value === previousVal)) {
          select.value = previousVal;
        }
      }

      function renderDraws() {
        const container = document.getElementById("draws-list");
        const selectedYear = document.getElementById("year-filter").value;

        const filtered =
          selectedYear === "ALL"
            ? allDrawsDesc
            : allDrawsDesc.filter((d) => String(d.year) === selectedYear);

        if (!filtered.length) {
          container.innerHTML = '<div class="empty-msg">Nu există extrageri pentru anul selectat.</div>';
          return;
        }

        container.innerHTML = filtered
          .map((d) => {
            const mainHtml = d.mainNumbers.map((n) => `<span class="ball">${n}</span>`).join("");
            const euroHtml = d.euroNumbers.map((n) => `<span class="ball euro">${n}</span>`).join("");

            return `
              <div class="draw-card">
                <div class="draw-header">
                  <span class="draw-date">${d.date}</span>
                  <span class="draw-year">${d.year || "-"}</span>
                </div>
                <div class="balls-wrap">
                  ${mainHtml}
                  <span class="sep">+</span>
                  ${euroHtml}
                </div>
              </div>
            `;
          })
          .join("");
      }

      function loadJsonFile() {
        setStatus("Se actualizează...");
        fetch("./draws.json?t=" + Date.now())
          .then((res) => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then((data) => {
            allDrawsDesc = normalizeDraws(data);
            populateYearFilter(allDrawsDesc);
            renderDraws();

            document.getElementById("json-view").value = JSON.stringify(data, null, 2);

            const latestDate = allDrawsDesc.length ? allDrawsDesc[0].date : "-";
            const oldestDate = allDrawsDesc.length ? allDrawsDesc[allDrawsDesc.length - 1].date : "-";

            document.getElementById("meta-info").innerHTML =
              "Extrageri: <strong>" +
              allDrawsDesc.length +
              "</strong> | Interval: <strong>" +
              latestDate +
              " → " +
              oldestDate +
              "</strong>";

            setStatus("JSON încărcat.");
          })
          .catch((err) => {
            document.getElementById("draws-list").innerHTML =
              '<div class="empty-msg">Nu s-a putut citi draws.json (' + err.message + ').</div>';
            setStatus("Eroare la citirea draws.json (" + err.message + ").");
          });
      }

      function copyJson() {
        const text = document.getElementById("json-view").value;
        if (!text) {
          setStatus("Nu există conținut JSON de copiat.");
          return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(text)
            .then(() => setStatus("JSON copiat în clipboard."))
            .catch(() => setStatus("Copierea automată nu a reușit."));
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("theme-btn").addEventListener("click", toggleTheme);
        document.getElementById("tab-draws-btn").addEventListener("click", function () {
          switchTab("draws");
        });
        document.getElementById("tab-json-btn").addEventListener("click", function () {
          switchTab("json");
        });
        document.getElementById("year-filter").addEventListener("change", renderDraws);
        document.getElementById("reload-btn").addEventListener("click", loadJsonFile);
        document.getElementById("copy-btn").addEventListener("click", copyJson);
        loadJsonFile();
      });
    })();
  </script>
</body>
</html>
