<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eurojackpot Auto JSON</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 640px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 14px;
      text-align: center;
    }

    .meta {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background-color: #020617;
      color: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background-color: #3b82f6;
      color: #ffffff;
    }

    .btn-secondary {
      background-color: #334155;
      color: #f8fafc;
    }

    .status {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #38bdf8;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Eurojackpot — JSON Automat</h1>
    <div class="meta" id="meta-info">Se încarcă draws.json...</div>
    <textarea id="json-view" readonly></textarea>

    <div class="actions">
      <button type="button" class="btn-primary" id="reload-btn">Reîncarcă JSON</button>
      <button type="button" class="btn-secondary" id="copy-btn">Copiază JSON</button>
    </div>
    <div class="status" id="status-msg"></div>
  </div>

  <script>
    (function () {
      function setStatus(msg) {
        document.getElementById("status-msg").textContent = msg;
      }

      function loadJsonFile() {
        setStatus("Se actualizează...");
        fetch("./draws.json?t=" + Date.now())
          .then((res) => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then((data) => {
            document.getElementById("json-view").value = JSON.stringify(data, null, 2);
            document.getElementById("meta-info").innerHTML =
              "Ultima rulare: <strong>" +
              (data.updatedAt || "-") +
              "</strong><br>Data detectată: <strong>" +
              (data.detectedDate || "nedetectată") +
              "</strong> | Status fetch: <strong>" +
              (data.fetchedOk ? "OK" : "Blocat / Eroare") +
              "</strong>";
            setStatus("Datele JSON au fost încărcate.");
          })
          .catch((err) => {
            setStatus("Nu s-a putut citi draws.json (" + err.message + "). Rulați întâi workflow-ul.");
          });
      }

      function copyJson() {
        const text = document.getElementById("json-view").value;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(text)
            .then(() => setStatus("JSON copiat în clipboard."))
            .catch(() => setStatus("Copierea automată nu a reușit."));
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("reload-btn").addEventListener("click", loadJsonFile);
        document.getElementById("copy-btn").addEventListener("click", copyJson);
        loadJsonFile();
      });
    })();
  </script>
</body>
</html>
